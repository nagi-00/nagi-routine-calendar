<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 파비콘 -->
  <link rel="icon" href="./favi.ico" type="image/x-icon">

  <meta charset="UTF-8" />
  <title>𝐝 : ᴄᴀʟᴇɴᴅᴀʀ</title>

  <!-- React & Babel CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- dom-to-image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>

  <style>
    @font-face {
      font-family: 'HJSS';
      src: url('./HJSS.ttf') format('truetype');
    }

    /* ── 색상 토큰 ── */
    :root {
      --bg:          #EEEAE3;
      --sh-dark:     #CEC8BE;
      --sh-light:    #FFFFFF;
      --text-pri:    #2C2825;
      --text-sub:    #8C8680;
      --text-muted:  #B8B2AA;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'HJSS', sans-serif;
    }

    body {
      background-color: var(--bg);
      min-height: 100vh;
    }

    .app-container {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* ── 사이드바 ── */
    .sidebar {
      width: 300px;
      background: var(--bg);
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      transition: transform 0.3s ease;
      z-index: 10;
      padding: 28px 24px;
      box-shadow: 8px 0 24px var(--sh-dark), -2px 0 10px var(--sh-light);
      overflow-y: auto;
    }
    .sidebar.collapsed { transform: translateX(-300px); }
    .sidebar.right-side {
      left: auto;
      right: 0;
      box-shadow: -8px 0 24px var(--sh-dark), 2px 0 10px var(--sh-light);
    }
    .sidebar.right-side.collapsed { transform: translateX(300px); }

    .sidebar-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 20px;
      letter-spacing: 0.08em;
    }

    .toggle-button {
      position: fixed;
      left: 300px;
      top: 20px;
      z-index: 20;
      background: var(--bg);
      border: none;
      padding: 10px 14px;
      cursor: pointer;
      transition: left 0.3s ease, right 0.3s ease;
      border-radius: 0 12px 12px 0;
      box-shadow: 6px 4px 12px var(--sh-dark), -1px -4px 10px var(--sh-light);
      color: var(--text-sub);
      font-size: 15px;
    }
    .toggle-button.collapsed { left: 0; }
    .toggle-button.right-side {
      left: auto;
      right: 300px;
      border-radius: 12px 0 0 12px;
      box-shadow: -6px 4px 12px var(--sh-dark), 1px -4px 10px var(--sh-light);
    }
    .toggle-button.right-side.collapsed { right: 0; }
    .toggle-button:active {
      box-shadow: inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
    }

    /* ── 메인 컨테이너 ── */
    .main-content {
      flex: 1;
      padding: 40px 20px;
      margin-left: 300px;
      transition: margin-left 0.3s ease, margin-right 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .main-content.expanded {
      margin-left: 0;
    }
    .main-content.right-sidebar {
      margin-left: 0;
      margin-right: 300px;
    }
    .main-content.right-sidebar.expanded {
      margin-left: 0;
    }

    /* ── 달력 카드 ── */
    .calendar-container {
      background: var(--bg);
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 10px 10px 20px var(--sh-dark), -10px -10px 20px var(--sh-light);
    }

    .month-navigator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .month-title {
      font-size: 17px;
      font-weight: 500;
      color: var(--text-pri);
    }

    .nav-button {
      background: var(--bg);
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--text-sub);
      font-size: 15px;
      border-radius: 10px;
      box-shadow: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
      transition: box-shadow 0.15s ease;
    }
    .nav-button:active {
      box-shadow: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
    }

    .calendar-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 0.06em;
    }

    /* ── 달력 그리드 ── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 36px);
      gap: 6px;
      justify-content: center;
    }

    /* 날짜 셀 래퍼 — 숫자 + pin 점 */
    .day-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .calendar-day {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border: none;
      cursor: pointer;
      border-radius: 50%;
      background: transparent;
      color: var(--text-pri);
      transition: box-shadow 0.15s ease;
      touch-action: manipulation;
      user-select: none;
    }
    .calendar-day.day-header {
      font-size: 11px;
      color: var(--text-muted);
      cursor: default;
      background: transparent;
    }
    .calendar-day:not(.day-header):not(.day-empty):hover {
      box-shadow: 3px 3px 7px var(--sh-dark), -3px -3px 7px var(--sh-light);
    }

    .pin-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      opacity: 0.75;
    }

    /* ── 달력 리스트 (사이드바) ── */
    .calendar-list {
      margin-bottom: 20px;
    }

    .calendar-item {
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      transition: box-shadow 0.15s ease;
      color: var(--text-sub);
      font-size: 14px;
      gap: 8px;
    }
    .calendar-item:hover {
      box-shadow: 3px 3px 8px var(--sh-dark), -3px -3px 8px var(--sh-light);
    }
    .calendar-item.selected {
      box-shadow: inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
    }

    .cal-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .cal-color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cal-title-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cal-item-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .calendar-item:hover .cal-item-actions {
      opacity: 1;
      pointer-events: auto;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      color: var(--text-sub);
    }
    .icon-btn.del:hover {
      color: #C0796A;
    }

    /* ── 인라인 편집 폼 ── */
    .cal-edit-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
    }
    .cal-edit-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* ── 새 캘린더 폼 ── */
    .new-calendar-form {
      margin-top: 20px;
    }

    .input-text {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      margin-bottom: 12px;
      background: var(--bg);
      box-shadow: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
      color: var(--text-pri);
      outline: none;
      font-size: 14px;
      font-family: 'HJSS', sans-serif;
    }
    .input-text::placeholder {
      color: var(--text-muted);
    }

    .input-text-sm {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 10px;
      background: var(--bg);
      box-shadow: inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
      color: var(--text-pri);
      outline: none;
      font-size: 13px;
      font-family: 'HJSS', sans-serif;
      min-width: 0;
    }

    .color-picker-container {
      display: flex;
      gap: 10px;
    }

    .color-picker {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: var(--bg);
      box-shadow: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
      padding: 3px;
    }

    .color-picker-sm {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: var(--bg);
      box-shadow: 3px 3px 6px var(--sh-dark), -3px -3px 6px var(--sh-light);
      padding: 2px;
      flex-shrink: 0;
    }

    .add-button {
      flex-grow: 1;
      padding: 10px;
      background: var(--bg);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
      color: var(--text-sub);
      font-size: 14px;
      transition: box-shadow 0.15s ease;
      font-family: 'HJSS', sans-serif;
    }
    .add-button:active {
      box-shadow: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
    }

    .sm-button {
      padding: 6px 10px;
      background: var(--bg);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 3px 3px 6px var(--sh-dark), -3px -3px 6px var(--sh-light);
      color: var(--text-sub);
      font-size: 12px;
      transition: box-shadow 0.15s ease;
      font-family: 'HJSS', sans-serif;
      white-space: nowrap;
    }
    .sm-button:active {
      box-shadow: inset 3px 3px 6px var(--sh-dark), inset -3px -3px 6px var(--sh-light);
    }

    /* ── 포커스 메시지 위젯 ── */
    .focus-widget {
      width: 100%;
      max-width: 380px;
      margin-top: 20px;
      background: var(--bg);
      border-radius: 20px;
      padding: 20px 24px;
      box-shadow: 8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light);
    }

    .focus-widget-label {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .focus-widget-text {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.75;
    }

    /* ── export 버튼 ── */
    .export-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      padding: 10px 20px;
      background: var(--bg);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 5px 5px 10px var(--sh-dark), -5px -5px 10px var(--sh-light);
      color: var(--text-sub);
      font-size: 12px;
      letter-spacing: 0.08em;
      transition: box-shadow 0.15s ease, color 0.2s ease;
      font-family: 'HJSS', sans-serif;
    }
    .export-btn:hover {
      color: var(--text-pri);
    }
    .export-btn:active {
      box-shadow: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
    }
    .export-btn.done {
      color: #6b9e7a;
    }

    /* ── 포스트잇 ── */
    .postit-col {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding-top: 28px;
      flex-shrink: 0;
    }

    .postit {
      width: 168px;
      background: var(--bg);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 19px,
        rgba(206, 200, 190, 0.22) 19px,
        rgba(206, 200, 190, 0.22) 20px
      );
      border-radius: 2px 2px 10px 10px;
      padding: 32px 14px 16px;
      box-shadow: 4px 8px 20px rgba(206,200,190,0.95), -3px -2px 10px rgba(255,255,255,0.85);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .postit:hover {
      box-shadow: 6px 12px 28px rgba(206,200,190,1), -4px -3px 12px rgba(255,255,255,0.9);
    }

    /* 압정 */
    .postit-tack {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      z-index: 2;
      box-shadow:
        0 2px 5px rgba(0,0,0,0.22),
        inset 0 1px 3px rgba(255,255,255,0.65),
        inset 0 -1px 2px rgba(0,0,0,0.18);
    }

    /* 고스트 날짜 숫자 */
    .postit-day-bg {
      position: absolute;
      bottom: -6px;
      right: 8px;
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      opacity: 0.055;
      color: #2C2825;
      user-select: none;
      pointer-events: none;
      letter-spacing: -0.02em;
    }

    .postit-date {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .postit-memo {
      font-size: 12px;
      color: var(--text-pri);
      line-height: 20px;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
      z-index: 1;
    }

    .postit-actions {
      display: none;
      position: absolute;
      top: 10px;
      right: 8px;
      gap: 4px;
      z-index: 3;
    }
    .postit:hover .postit-actions {
      display: flex;
    }

    .postit-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #EEEAE3;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 5px var(--sh-dark), -1px -1px 4px var(--sh-light);
      color: var(--text-muted);
      transition: color 0.15s ease, box-shadow 0.15s ease;
      padding: 0;
    }
    .postit-btn:hover {
      color: var(--text-sub);
      box-shadow: 3px 3px 7px var(--sh-dark), -2px -2px 5px var(--sh-light);
    }
    .postit-btn.del:hover {
      color: #C0796A;
    }
    .postit-btn:active {
      box-shadow: inset 2px 2px 4px var(--sh-dark), inset -1px -1px 3px var(--sh-light);
    }

    /* ── Pin 모달 ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(238, 234, 227, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-card {
      background: var(--bg);
      border-radius: 20px;
      padding: 28px 26px;
      width: 300px;
      box-shadow: 12px 12px 24px var(--sh-dark), -12px -12px 24px var(--sh-light);
    }

    .modal-date-label {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      margin-bottom: 4px;
    }

    .modal-cal-label {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    .modal-textarea {
      width: 100%;
      min-height: 110px;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      background: var(--bg);
      box-shadow: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
      color: var(--text-pri);
      outline: none;
      font-size: 13px;
      font-family: 'HJSS', sans-serif;
      resize: none;
      line-height: 1.65;
      margin-bottom: 16px;
    }
    .modal-textarea::placeholder {
      color: var(--text-muted);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-hint {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 12px;
      letter-spacing: 0.04em;
    }

    /* ── 비밀번호 화면 (구조 유지용, 사용 안 함) ── */
    .password-container {
      background: var(--bg);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 360px;
      margin: 100px auto;
      text-align: center;
      box-shadow: 10px 10px 20px var(--sh-dark), -10px -10px 20px var(--sh-light);
    }

    .password-title {
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }

    /* ── 설정 패널 ── */
    .settings-panel {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--sh-dark);
    }
    .settings-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-sub);
      letter-spacing: 0.06em;
      margin-bottom: 0;
      padding: 4px 0;
      background: none;
      border: none;
      width: 100%;
      font-family: 'HJSS', sans-serif;
    }
    .settings-toggle:hover { color: var(--text-pri); }
    .settings-body { margin-top: 16px; }
    .settings-section-label {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .theme-dots {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .theme-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .focus-msg-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.5;
    }
    .focus-msg-text {
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }
    .focus-add-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      align-items: flex-end;
    }
    .focus-add-textarea {
      flex: 1;
      min-height: 44px;
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      background: var(--bg);
      box-shadow: inset 3px 3px 6px var(--sh-dark), inset -3px -3px 6px var(--sh-light);
      color: var(--text-pri);
      outline: none;
      font-size: 12px;
      font-family: 'HJSS', sans-serif;
      resize: none;
      line-height: 1.5;
    }

    /* ── 포커스 위젯 헤더 행 ── */
    .focus-widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .focus-refresh-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color 0.15s;
      line-height: 1;
    }
    .focus-refresh-btn:hover {
      color: var(--text-sub);
    }

    /* ── 통계 모달 ── */
    .stats-scroll-wrap {
      max-height: 88vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 4px;
    }
    /* 카드 1장 (달력 1개) */
    .share-card {
      width: 340px;
      background: var(--bg);
      border-radius: 28px;
      padding: 28px 26px 22px;
      box-shadow: 14px 14px 28px var(--sh-dark), -14px -14px 28px var(--sh-light);
      position: relative;
      overflow: hidden;
    }
    /* 상단 컬러 바 */
    .share-card-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      border-radius: 28px 28px 0 0;
    }
    .share-card-title {
      font-size: 16px;
      color: var(--text-pri);
      margin-bottom: 3px;
      letter-spacing: 0.02em;
      font-weight: 500;
    }
    .share-card-month {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    /* 미니 캘린더 */
    .share-mini-cal {
      margin-bottom: 18px;
    }
    .share-mini-cal-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 6px;
    }
    .share-mini-dow {
      text-align: center;
      font-size: 8px;
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }
    .share-mini-cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    .share-mini-day {
      aspect-ratio: 1;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: var(--text-muted);
      background: transparent;
    }
    .share-mini-day.empty { opacity: 0; pointer-events: none; }
    .share-mini-day.done { font-weight: 600; }
    /* 하단 문구 */
    .share-card-footer {
      border-top: 1px solid var(--sh-dark);
      padding-top: 14px;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .share-card-count {
      font-size: 28px;
      font-weight: 600;
      color: var(--text-pri);
      line-height: 1;
    }
    .share-card-suffix {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.5;
    }
    /* export 버튼 */
    .stats-export-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 340px;
      padding: 11px;
      background: var(--bg);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
      color: var(--text-sub);
      font-size: 12px;
      letter-spacing: 0.08em;
      transition: box-shadow 0.15s ease, color 0.2s ease;
      font-family: 'HJSS', sans-serif;
      flex-shrink: 0;
    }
    .stats-export-btn:hover { color: var(--text-pri); }
    .stats-export-btn:active {
      box-shadow: inset 3px 3px 6px var(--sh-dark), inset -3px -3px 6px var(--sh-light);
    }
    .stats-export-btn.done { color: #6b9e7a; }

    /* ── 전체 메모 모달 ── */
    .memos-modal-card {
      background: var(--bg);
      border-radius: 24px;
      padding: 32px 28px;
      width: 480px;
      max-width: 92vw;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 16px 16px 32px var(--sh-dark), -16px -16px 32px var(--sh-light);
    }
    .memos-modal-title {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .memo-group-label {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin: 16px 0 8px;
    }
    .memo-entry {
      background: var(--bg);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 8px;
      box-shadow: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
    }
    .memo-entry-date {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }
    .memo-entry-text {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .memo-entry-img {
      width: 100%;
      border-radius: 8px;
      margin-top: 8px;
      display: block;
    }
    .memos-empty {
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
      padding: 32px 0;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
  /********************************************************
   * 1) 아이콘 컴포넌트
   ********************************************************/
  const IconPen = ({ size = 11 }) => (
    <svg width={size} height={size} viewBox="0 0 16 16" fill="none"
      stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
      <path d="M11.5 1.5 L14.5 4.5 L5 14 L1.5 14.5 L2 11 Z" />
      <line x1="9" y1="3.5" x2="12.5" y2="7" />
    </svg>
  );

  const IconX = ({ size = 9 }) => (
    <svg width={size} height={size} viewBox="0 0 12 12" fill="none"
      stroke="currentColor" strokeWidth="1.7" strokeLinecap="round">
      <line x1="2" y1="2" x2="10" y2="10" />
      <line x1="10" y1="2" x2="2" y2="10" />
    </svg>
  );

  // 배경색 밝기에 따라 텍스트 색상 자동 결정
  const getContrastColor = (hex) => {
    if (!hex || hex.length < 7) return '#2C2825';
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.55 ? '#2C2825' : '#FFFFFF';
  };

  /********************************************************
   * 2) 상수 및 유틸
   ********************************************************/
  const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const THEMES = [
    { name: 'Sand',      bg: '#EEEAE3', dark: '#CEC8BE', light: '#FFFFFF' },
    { name: 'Parchment', bg: '#E8E2D8', dark: '#C8C2B8', light: '#FFFEF8' },
    { name: 'Cream',     bg: '#F2EDE6', dark: '#D2CDC6', light: '#FFFFFF' },
    { name: 'Mist',      bg: '#E6EAE8', dark: '#C6CAC8', light: '#FFFFFF' },
    { name: 'Rose',      bg: '#EDE8E8', dark: '#CDC8C8', light: '#FFFFFF' },
  ];

  const applyTheme = (s) => {
    document.documentElement.style.setProperty('--bg', s.bgColor);
    document.documentElement.style.setProperty('--sh-dark', s.bgDark);
    document.documentElement.style.setProperty('--sh-light', s.bgLight);
  };

  const defaultSettings = {
    bgColor: '#EEEAE3',
    bgDark: '#CEC8BE',
    bgLight: '#FFFFFF',
    subtitle: '내면의 성장을 향한 여정',
    sidebarPosition: 'left',
    focusMessages: [
      '오늘도 한 걸음씩, 꾸준히.',
      '작은 변화가 큰 성장을 만든다.',
      '지금 이 순간이 가장 중요하다.',
      '매일의 기록이 당신의 역사가 된다.',
      '포기하지 않는 것이 가장 큰 용기다.',
    ],
  };

  /********************************************************
   * 3) 앱 컴포넌트
   ********************************************************/
  function App() {
    const [isSidebarCollapsed, setIsSidebarCollapsed] = React.useState(false);
    const [currentDate, setCurrentDate] = React.useState(new Date());
    const [calendars, setCalendars] = React.useState([]);
    const [selectedCalendar, setSelectedCalendar] = React.useState(null);

    const [newTitle, setNewTitle] = React.useState('');
    const [newColor, setNewColor] = React.useState('#9CA3AF');

    // 인라인 편집
    const [editingCalId, setEditingCalId] = React.useState(null);
    const [editTitle, setEditTitle] = React.useState('');
    const [editColor, setEditColor] = React.useState('#9CA3AF');

    // 설정
    const [settings, setSettings] = React.useState(defaultSettings);
    const [isSettingsOpen, setIsSettingsOpen] = React.useState(false);
    const [newFocusMsg, setNewFocusMsg] = React.useState('');
    const [editSubtitle, setEditSubtitle] = React.useState('');
    const [editingFocusIdx, setEditingFocusIdx] = React.useState(null);
    const [editingFocusText, setEditingFocusText] = React.useState('');

    // 포커스 메시지
    const [focusMessage, setFocusMessage] = React.useState('');

    // export 상태: 'idle' | 'loading' | 'copied' | 'saved'
    const [exportStatus, setExportStatus] = React.useState('idle');
    const [statsExportStatus, setStatsExportStatus] = React.useState('idle');

    // Pin 모달
    const [pinModal, setPinModal] = React.useState({ open: false, dateKey: '', memo: '', image: null });

    // 통계 / 전체 메모 모달
    const [showStats, setShowStats] = React.useState(false);
    const [showMemos, setShowMemos] = React.useState(false);

    // 롱프레스 감지 ref
    const pressTimer = React.useRef(null);
    const didLongPress = React.useRef(false);

    /********************************************************
     * (3-0) 데이터 로드 (Electron IPC)
     ********************************************************/
    const loadAll = () => {
      window.electronAPI.getData().then(({ calendars: cals, settings: setts }) => {
        const loadedCals = cals || [];
        setCalendars(loadedCals);
        setSelectedCalendar(loadedCals.length > 0 ? loadedCals[0].id : null);

        const s = { ...defaultSettings, ...setts };
        setSettings(s);
        setEditSubtitle(s.subtitle);
        applyTheme(s);

        if (s.focusMessages && s.focusMessages.length > 0) {
          setFocusMessage(s.focusMessages[Math.floor(Math.random() * s.focusMessages.length)]);
        }
      });
    };

    React.useEffect(() => {
      loadAll();
      window.electronAPI.onMenuAction((action) => {
        if (action === 'reload') loadAll();
        if (action === 'showStats') setShowStats(true);
        if (action === 'showMemos') setShowMemos(true);
      });
    }, []);

    /********************************************************
     * (3-1) 저장 헬퍼
     ********************************************************/
    const save = (newCals, newSetts) => {
      window.electronAPI.saveData({
        calendars: newCals ?? calendars,
        settings: newSetts ?? settings,
      });
    };

    /********************************************************
     * (3-2) export
     ********************************************************/
    const exportCalendar = async () => {
      if (exportStatus === 'loading') return;
      setExportStatus('loading');
      try {
        const el = document.getElementById('calendar-export-area');
        const navBtns = el.querySelectorAll('.nav-button');
        navBtns.forEach(b => { b.style.visibility = 'hidden'; });
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        let blob;
        try {
          const scale = 2;
          blob = await domtoimage.toBlob(el, {
            bgcolor: settings.bgColor,
            width:  el.offsetWidth  * scale,
            height: el.offsetHeight * scale,
            style: {
              transform: `scale(${scale})`,
              transformOrigin: 'top left',
              width:  el.offsetWidth  + 'px',
              height: el.offsetHeight + 'px',
            },
          });
        } finally {
          navBtns.forEach(b => { b.style.visibility = ''; });
        }

        let status = 'saved';
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          status = 'copied';
        } catch {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `calendar-${currentDate.getFullYear()}-${currentDate.getMonth() + 1}.png`;
          a.click();
          URL.revokeObjectURL(url);
        }
        setExportStatus(status);
        setTimeout(() => setExportStatus('idle'), 2200);
      } catch (err) {
        console.error('export 실패:', err);
        setExportStatus('idle');
      }
    };

    const exportStats = async () => {
      if (statsExportStatus === 'loading') return;
      setStatsExportStatus('loading');
      try {
        const el = document.getElementById('stats-export-area');
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
        const scale = 2;
        const blob = await domtoimage.toBlob(el, {
          bgcolor: settings.bgColor,
          width: el.offsetWidth * scale,
          height: el.offsetHeight * scale,
          style: {
            transform: `scale(${scale})`,
            transformOrigin: 'top left',
            width: el.offsetWidth + 'px',
            height: el.offsetHeight + 'px',
          },
        });
        let status = 'saved';
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
          status = 'copied';
        } catch {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `stats-${new Date().toISOString().slice(0,10)}.png`;
          a.click();
          URL.revokeObjectURL(url);
        }
        setStatsExportStatus(status);
        setTimeout(() => setStatsExportStatus('idle'), 2200);
      } catch (err) {
        console.error('stats export 실패:', err);
        setStatsExportStatus('idle');
      }
    };

    /********************************************************
     * (3-3) 새 캘린더 추가
     ********************************************************/
    const addCalendar = () => {
      if (!newTitle.trim()) return;
      const newCal = {
        id: genId(),
        title: newTitle.trim(),
        color: newColor,
        completedDates: [],
        pinnedDates: {},
      };
      const newCals = [...calendars, newCal];
      setCalendars(newCals);
      if (!selectedCalendar) setSelectedCalendar(newCal.id);
      save(newCals, null);
      setNewTitle('');
      setNewColor('#9CA3AF');
    };

    /********************************************************
     * (3-4) 달력 편집
     ********************************************************/
    const startEditCalendar = (cal, e) => {
      e.stopPropagation();
      setEditingCalId(cal.id);
      setEditTitle(cal.title);
      setEditColor(cal.color);
    };

    const saveEditCalendar = (calId) => {
      if (!editTitle.trim()) return;
      const newCals = calendars.map(c =>
        c.id === calId ? { ...c, title: editTitle.trim(), color: editColor } : c
      );
      setCalendars(newCals);
      save(newCals, null);
      setEditingCalId(null);
    };

    const cancelEditCalendar = () => setEditingCalId(null);

    /********************************************************
     * (3-5) 날짜 토글
     ********************************************************/
    const toggleDate = (day) => {
      if (!selectedCalendar) return;
      const targetCal = calendars.find(c => c.id === selectedCalendar);
      if (!targetCal) return;

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      const dateKey = `${year}-${month}-${day}`;

      const dates = [...(targetCal.completedDates || [])];
      const idx = dates.indexOf(dateKey);
      if (idx === -1) { dates.push(dateKey); } else { dates.splice(idx, 1); }

      const newCals = calendars.map(c =>
        c.id === selectedCalendar ? { ...c, completedDates: dates } : c
      );
      setCalendars(newCals);
      save(newCals, null);
    };

    /********************************************************
     * (3-6) 달력 삭제
     ********************************************************/
    const deleteCalendar = (calendarId, e) => {
      e.stopPropagation();
      const ok = window.confirm('정말 이 캘린더를 삭제할까?');
      if (!ok) return;
      const newCals = calendars.filter(c => c.id !== calendarId);
      setCalendars(newCals);
      if (selectedCalendar === calendarId) {
        setSelectedCalendar(newCals.length > 0 ? newCals[0].id : null);
      }
      save(newCals, null);
    };

    /********************************************************
     * (3-7) 롱프레스 — Pin 모달
     ********************************************************/
    const openPinModal = (day) => {
      if (!selectedCalendar) return;
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      const dateKey = `${year}-${month}-${day}`;
      const existing = (currentCalendar.pinnedDates || {})[dateKey] || {};
      const memo = typeof existing === 'string' ? existing : (existing.memo || '');
      const image = typeof existing === 'string' ? null : (existing.image || null);
      setPinModal({ open: true, dateKey, memo, image });
    };

    const savePinMemo = () => {
      if (!selectedCalendar) return;
      const newPinnedDates = { ...(currentCalendar.pinnedDates || {}) };
      if (pinModal.memo.trim() || pinModal.image) {
        newPinnedDates[pinModal.dateKey] = { memo: pinModal.memo.trim(), image: pinModal.image };
      } else {
        delete newPinnedDates[pinModal.dateKey];
      }
      const newCals = calendars.map(c =>
        c.id === selectedCalendar ? { ...c, pinnedDates: newPinnedDates } : c
      );
      setCalendars(newCals);
      save(newCals, null);
      setPinModal({ open: false, dateKey: '', memo: '', image: null });
    };

    const removePin = (dateKey) => {
      if (!selectedCalendar) return;
      const newPinnedDates = { ...(currentCalendar.pinnedDates || {}) };
      delete newPinnedDates[dateKey];
      const newCals = calendars.map(c =>
        c.id === selectedCalendar ? { ...c, pinnedDates: newPinnedDates } : c
      );
      setCalendars(newCals);
      save(newCals, null);
    };

    const handleImageSelect = (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => setPinModal(prev => ({ ...prev, image: ev.target.result }));
      reader.readAsDataURL(file);
    };

    const handlePressStart = (day) => {
      didLongPress.current = false;
      clearTimeout(pressTimer.current);
      pressTimer.current = setTimeout(() => {
        didLongPress.current = true;
        openPinModal(day);
      }, 600);
    };

    const handlePressEnd = () => {
      clearTimeout(pressTimer.current);
    };

    const handleDayClick = (day) => {
      if (didLongPress.current) return;
      toggleDate(day);
    };

    /********************************************************
     * (3-8) 월 이동, 사이드바 토글
     ********************************************************/
    const navigateMonth = (direction) => {
      setCurrentDate(prev => {
        const d = new Date(prev);
        d.setMonth(d.getMonth() + (direction === 'prev' ? -1 : 1));
        return d;
      });
    };

    const toggleSidebar = () => setIsSidebarCollapsed(v => !v);

    /********************************************************
     * (3-9) 설정 핸들러
     ********************************************************/
    const applyThemePreset = (theme) => {
      const newSetts = { ...settings, bgColor: theme.bg, bgDark: theme.dark, bgLight: theme.light };
      setSettings(newSetts);
      applyTheme(newSetts);
      save(null, newSetts);
    };

    const saveSubtitle = () => {
      const newSetts = { ...settings, subtitle: editSubtitle };
      setSettings(newSetts);
      save(null, newSetts);
    };

    const addFocusMessage = () => {
      if (!newFocusMsg.trim()) return;
      const newMsgs = [...(settings.focusMessages || []), newFocusMsg.trim()];
      const newSetts = { ...settings, focusMessages: newMsgs };
      setSettings(newSetts);
      setFocusMessage(newFocusMsg.trim());
      save(null, newSetts);
      setNewFocusMsg('');
    };

    const deleteFocusMessage = (idx) => {
      const newMsgs = settings.focusMessages.filter((_, i) => i !== idx);
      const newSetts = { ...settings, focusMessages: newMsgs };
      setSettings(newSetts);
      save(null, newSetts);
      if (newMsgs.length > 0) {
        setFocusMessage(newMsgs[Math.floor(Math.random() * newMsgs.length)]);
      } else {
        setFocusMessage('');
      }
    };

    const saveFocusEdit = (idx) => {
      const trimmed = editingFocusText.trim();
      if (!trimmed) return;
      const newMsgs = settings.focusMessages.map((m, i) => i === idx ? trimmed : m);
      const newSetts = { ...settings, focusMessages: newMsgs };
      setSettings(newSetts);
      save(null, newSetts);
      setEditingFocusIdx(null);
      setEditingFocusText('');
    };

    const refreshFocusMessage = () => {
      const msgs = settings.focusMessages;
      if (!msgs || msgs.length === 0) return;
      setFocusMessage(msgs[Math.floor(Math.random() * msgs.length)]);
    };

    /********************************************************
     * (3-10) 파생 값
     ********************************************************/
    const currentCalendar = calendars.find(c => c.id === selectedCalendar)
                          || { completedDates: [], color: '#9CA3AF', pinnedDates: {} };

    const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
    const firstDay    = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();

    const pinnedDates = currentCalendar.pinnedDates || {};
    const monthPrefix = `${currentDate.getFullYear()}-${currentDate.getMonth() + 1}-`;
    const currentMonthPins = Object.entries(pinnedDates)
      .filter(([key]) => key.startsWith(monthPrefix))
      .sort(([a], [b]) => parseInt(a.split('-')[2]) - parseInt(b.split('-')[2]));

    const formatDateKey = (dateKey) => {
      const [year, month, day] = dateKey.split('-');
      return `${year}. ${String(month).padStart(2, '0')}. ${String(day).padStart(2, '0')}`;
    };

    const postitRotations = [-1.5, 1, -0.8, 1.3, -1.1, 0.7];

    /********************************************************
     * (3-11) 렌더링
     ********************************************************/
    return (
      <div className="app-container">

        {/* ── 사이드바 ── */}
        <div className={`sidebar ${isSidebarCollapsed ? 'collapsed' : ''} ${settings.sidebarPosition === 'right' ? 'right-side' : ''}`}>
          <p className="sidebar-title">List</p>

          <div className="calendar-list">
            {calendars.map(cal => {
              if (editingCalId === cal.id) {
                return (
                  <div key={cal.id} className="cal-edit-form">
                    <input
                      type="text"
                      className="input-text-sm"
                      value={editTitle}
                      onChange={(e) => setEditTitle(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && saveEditCalendar(cal.id)}
                      autoFocus
                      style={{ marginBottom: 0 }}
                    />
                    <div className="cal-edit-row">
                      <input
                        type="color"
                        className="color-picker-sm"
                        value={editColor}
                        onChange={(e) => setEditColor(e.target.value)}
                      />
                      <button className="sm-button" style={{ flex: 1 }} onClick={() => saveEditCalendar(cal.id)}>저장</button>
                      <button className="sm-button" onClick={cancelEditCalendar}>취소</button>
                    </div>
                  </div>
                );
              }

              return (
                <div
                  key={cal.id}
                  className={`calendar-item ${selectedCalendar === cal.id ? 'selected' : ''}`}
                  onClick={() => setSelectedCalendar(cal.id)}
                >
                  <div className="cal-item-left">
                    <div className="cal-color-dot" style={{ background: cal.color }} />
                    <span className="cal-title-text">{cal.title}</span>
                  </div>
                  <div className="cal-item-actions">
                    <button
                      className="icon-btn"
                      onClick={(e) => startEditCalendar(cal, e)}
                      title="편집"
                    ><IconPen size={11} /></button>
                    <button
                      className="icon-btn del"
                      onClick={(e) => deleteCalendar(cal.id, e)}
                      title="삭제"
                    ><IconX size={9} /></button>
                  </div>
                </div>
              );
            })}
          </div>

          {/* 새 캘린더 폼 */}
          <div className="new-calendar-form">
            <input
              type="text"
              className="input-text"
              placeholder="Title here"
              value={newTitle}
              onChange={(e) => setNewTitle(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && addCalendar()}
            />
            <div className="color-picker-container">
              <input
                type="color"
                className="color-picker"
                value={newColor}
                onChange={(e) => setNewColor(e.target.value)}
              />
              <button className="add-button" onClick={addCalendar}>Add</button>
            </div>
          </div>

          {/* ── 설정 패널 ── */}
          <div className="settings-panel">
            <button
              className="settings-toggle"
              onClick={() => setIsSettingsOpen(v => !v)}
            >
              <span>Settings</span>
              <span style={{ fontSize: 11 }}>{isSettingsOpen ? '▲' : '▼'}</span>
            </button>

            {isSettingsOpen && (
              <div className="settings-body">

                {/* 배경 테마 */}
                <p className="settings-section-label">background</p>
                <div className="theme-dots">
                  {THEMES.map(theme => {
                    const isActive = settings.bgColor === theme.bg;
                    return (
                      <button
                        key={theme.name}
                        className="theme-dot"
                        title={theme.name}
                        style={{
                          background: theme.bg,
                          boxShadow: isActive
                            ? `inset 3px 3px 6px ${theme.dark}, inset -3px -3px 6px ${theme.light}`
                            : `3px 3px 6px ${theme.dark}, -3px -3px 6px ${theme.light}`,
                        }}
                        onClick={() => applyThemePreset(theme)}
                      />
                    );
                  })}
                </div>

                {/* 서브타이틀 */}
                <p className="settings-section-label">subtitle</p>
                <div className="cal-edit-row" style={{ marginBottom: 16 }}>
                  <input
                    type="text"
                    className="input-text-sm"
                    value={editSubtitle}
                    onChange={(e) => setEditSubtitle(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && saveSubtitle()}
                  />
                  <button className="sm-button" onClick={saveSubtitle}>저장</button>
                </div>

                {/* 사이드바 위치 */}
                <p className="settings-section-label">sidebar</p>
                <div style={{ display: 'flex', gap: 8, marginBottom: 12 }}>
                  {['left', 'right'].map(pos => {
                    const isActive = (settings.sidebarPosition || 'left') === pos;
                    return (
                      <button
                        key={pos}
                        style={{
                          flex: 1,
                          padding: '8px 0',
                          border: 'none',
                          borderRadius: 10,
                          cursor: 'pointer',
                          background: 'var(--bg)',
                          color: isActive ? 'var(--text-pri)' : 'var(--text-muted)',
                          fontSize: 11,
                          letterSpacing: '0.1em',
                          fontFamily: 'HJSS, sans-serif',
                          boxShadow: isActive
                            ? 'inset 3px 3px 6px var(--sh-dark), inset -3px -3px 6px var(--sh-light)'
                            : '3px 3px 6px var(--sh-dark), -3px -3px 6px var(--sh-light)',
                          transition: 'box-shadow 0.15s ease',
                        }}
                        onClick={() => {
                          const newS = { ...settings, sidebarPosition: pos };
                          setSettings(newS);
                          save(null, newS);
                        }}
                      >
                        {pos === 'left' ? '← 왼쪽' : '오른쪽 →'}
                      </button>
                    );
                  })}
                </div>

                {/* 포커스 메시지 */}
                <p className="settings-section-label">focus</p>
                <div>
                  {(settings.focusMessages || []).map((msg, idx) => (
                    <div key={idx} className="focus-msg-item">
                      {editingFocusIdx === idx ? (
                        <>
                          <textarea
                            className="focus-add-textarea"
                            rows={2}
                            value={editingFocusText}
                            onChange={(e) => setEditingFocusText(e.target.value)}
                            autoFocus
                            style={{ flex: 1 }}
                          />
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '4px', flexShrink: 0 }}>
                            <button className="sm-button" onClick={() => saveFocusEdit(idx)} style={{ fontSize: '10px', padding: '3px 7px' }}>저장</button>
                            <button className="sm-button" onClick={() => { setEditingFocusIdx(null); setEditingFocusText(''); }} style={{ fontSize: '10px', padding: '3px 7px' }}>취소</button>
                          </div>
                        </>
                      ) : (
                        <>
                          <span className="focus-msg-text">{msg}</span>
                          <button
                            style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-muted)', padding: '2px', flexShrink: 0, display: 'flex', alignItems: 'center' }}
                            onClick={() => { setEditingFocusIdx(idx); setEditingFocusText(msg); }}
                            title="편집"
                          >
                            <IconPen size={8} />
                          </button>
                          <button
                            style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-muted)', padding: '2px', flexShrink: 0, display: 'flex', alignItems: 'center' }}
                            onClick={() => deleteFocusMessage(idx)}
                            title="삭제"
                          >
                            <IconX size={8} />
                          </button>
                        </>
                      )}
                    </div>
                  ))}
                  <div className="focus-add-row">
                    <textarea
                      className="focus-add-textarea"
                      rows={2}
                      placeholder="새 메시지 입력..."
                      value={newFocusMsg}
                      onChange={(e) => setNewFocusMsg(e.target.value)}
                    />
                    <button className="sm-button" onClick={addFocusMessage}>+</button>
                  </div>
                </div>

              </div>
            )}
          </div>

        </div>

        {/* 사이드바 토글 버튼 */}
        <button
          className={`toggle-button ${isSidebarCollapsed ? 'collapsed' : ''} ${settings.sidebarPosition === 'right' ? 'right-side' : ''}`}
          onClick={toggleSidebar}
        >
          {settings.sidebarPosition === 'right'
            ? (isSidebarCollapsed ? '←' : '→')
            : (isSidebarCollapsed ? '→' : '←')}
        </button>

        {/* ── 메인 컨텐츠 ── */}
        <div className={`main-content ${isSidebarCollapsed ? 'expanded' : ''} ${settings.sidebarPosition === 'right' ? 'right-sidebar' : ''}`}>

          {/* ── export 캡처 영역 (달력 + 포스트잇 flex row) ── */}
          <div
            id="calendar-export-area"
            style={{
              background: settings.bgColor || '#EEEAE3',
              borderRadius: '32px',
              padding: '32px',
              display: 'flex',
              gap: '24px',
              alignItems: 'flex-start',
            }}
          >

            {/* 왼쪽 컬럼: 달력 + 포커스 위젯 */}
            <div style={{ flex: '0 0 auto' }}>

              {/* 달력 카드 */}
              <div className="calendar-container">
                <div className="month-navigator">
                  <button className="nav-button" onClick={() => navigateMonth('prev')}>←</button>
                  <span className="month-title">
                    {currentDate.toLocaleString('en-US', { month: 'long', year: 'numeric' })}
                  </span>
                  <button className="nav-button" onClick={() => navigateMonth('next')}>→</button>
                </div>

                <p className="calendar-subtitle">{settings.subtitle}</p>

                {/* 요일 헤더 */}
                <div className="calendar-grid" style={{ marginBottom: '8px' }}>
                  {['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d => (
                    <div key={d} className="calendar-day day-header">{d}</div>
                  ))}
                </div>

                {/* 날짜 그리드 */}
                <div className="calendar-grid">
                  {Array(firstDay).fill(null).map((_, i) => (
                    <div key={`empty-${i}`} className="calendar-day day-empty" />
                  ))}
                  {Array(daysInMonth).fill(null).map((_, i) => {
                    const day = i + 1;
                    const year  = currentDate.getFullYear();
                    const month = currentDate.getMonth() + 1;
                    const dateKey = `${year}-${month}-${day}`;
                    const isCompleted = currentCalendar.completedDates.includes(dateKey);
                    const isPinned = !!(pinnedDates[dateKey]);
                    return (
                      <div key={day} className="day-wrapper">
                        <button
                          className="calendar-day"
                          onMouseDown={() => handlePressStart(day)}
                          onMouseUp={handlePressEnd}
                          onMouseLeave={handlePressEnd}
                          onTouchStart={() => handlePressStart(day)}
                          onTouchEnd={handlePressEnd}
                          onClick={() => handleDayClick(day)}
                          style={{
                            backgroundColor: isCompleted ? currentCalendar.color : 'transparent',
                            mixBlendMode: isCompleted ? 'multiply' : 'normal',
                            color: isCompleted ? getContrastColor(currentCalendar.color) : '#2C2825',
                            boxShadow: isCompleted
                              ? 'inset 3px 3px 6px rgba(0,0,0,0.12), inset -2px -2px 5px rgba(255,255,255,0.25)'
                              : '',
                          }}
                        >
                          {day}
                        </button>
                        {isPinned && (
                          <div
                            className="pin-dot"
                            style={{ backgroundColor: currentCalendar.color }}
                          />
                        )}
                      </div>
                    );
                  })}
                </div>

              </div>

              {/* 포커스 메시지 위젯 */}
              {focusMessage && (
                <div className="focus-widget">
                  <div className="focus-widget-header">
                    <p className="focus-widget-label" style={{ marginBottom: 0 }}>focus</p>
                    <button
                      className="focus-refresh-btn"
                      onClick={refreshFocusMessage}
                      title="새 메시지"
                    >↺</button>
                  </div>
                  <p className="focus-widget-text">{focusMessage}</p>
                </div>
              )}

            </div>{/* /left col */}

            {/* 오른쪽 컬럼: 포스트잇 */}
            {currentMonthPins.length > 0 && (
              <div className="postit-col">
                {currentMonthPins.map(([dateKey, pinData], idx) => {
                  const pin = pinData;
                  const memo = typeof pin === 'string' ? pin : (pin?.memo || '');
                  const img = typeof pin === 'string' ? null : (pin?.image || null);
                  const dayNum = dateKey.split('-')[2];
                  return (
                    <div
                      key={dateKey}
                      className="postit"
                      style={{
                        transform: `rotate(${postitRotations[idx % postitRotations.length]}deg)`,
                      }}
                    >
                      {/* 압정 */}
                      <div
                        className="postit-tack"
                        style={{ background: currentCalendar.color }}
                      />

                      {/* 고스트 날짜 숫자 */}
                      <div className="postit-day-bg">{dayNum}</div>

                      {/* 날짜 레이블 */}
                      <p className="postit-date">{formatDateKey(dateKey)}</p>

                      {/* 메모 본문 */}
                      <p className="postit-memo">{memo}</p>

                      {/* 이미지 */}
                      {img ? <img src={img} alt="" style={{ width: '100%', borderRadius: '6px', marginTop: '8px', display: 'block' }} /> : null}

                      {/* 액션 버튼 */}
                      <div className="postit-actions">
                        <button
                          className="postit-btn"
                          onClick={() => {
                            const existing = currentCalendar.pinnedDates?.[dateKey] || {};
                            const m = typeof existing === 'string' ? existing : (existing.memo || '');
                            const im = typeof existing === 'string' ? null : (existing.image || null);
                            setPinModal({ open: true, dateKey, memo: m, image: im });
                          }}
                          title="편집"
                        ><IconPen size={10} /></button>
                        <button
                          className="postit-btn del"
                          onClick={() => removePin(dateKey)}
                          title="삭제"
                        ><IconX size={8} /></button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

          </div>{/* /calendar-export-area */}

          {/* export 버튼 (캡처 대상 밖) */}
          <button
            className={`export-btn${exportStatus === 'copied' || exportStatus === 'saved' ? ' done' : ''}`}
            onClick={exportCalendar}
            disabled={exportStatus === 'loading'}
          >
            {exportStatus === 'loading' && '…'}
            {exportStatus === 'copied'  && '✓ 클립보드에 복사됨'}
            {exportStatus === 'saved'   && '✓ 저장됨'}
            {exportStatus === 'idle'    && 'export'}
          </button>

        </div>{/* /main-content */}

        {/* ── Pin 메모 모달 ── */}
        {pinModal.open && (
          <div
            className="modal-overlay"
            onClick={() => setPinModal({ open: false, dateKey: '', memo: '', image: null })}
          >
            <div className="modal-card" onClick={(e) => e.stopPropagation()}>
              <p className="modal-date-label">{formatDateKey(pinModal.dateKey)}</p>
              <p className="modal-cal-label">{currentCalendar.title || ''}</p>
              <p className="modal-hint">메모를 비우고 저장하면 핀이 제거돼요.</p>
              <textarea
                className="modal-textarea"
                value={pinModal.memo}
                onChange={(e) => setPinModal(prev => ({ ...prev, memo: e.target.value }))}
                placeholder="이 날짜에 대해 남겨두고 싶은 말"
                autoFocus
              />

              {/* 이미지 첨부 */}
              <div style={{ marginBottom: '14px' }}>
                {pinModal.image ? (
                  <div style={{ position: 'relative', display: 'inline-block' }}>
                    <img
                      src={pinModal.image}
                      alt=""
                      style={{ maxWidth: '100%', maxHeight: '160px', borderRadius: '10px', display: 'block' }}
                    />
                    <button
                      onClick={() => setPinModal(prev => ({ ...prev, image: null }))}
                      style={{
                        position: 'absolute', top: 4, right: 4,
                        background: 'rgba(0,0,0,0.4)', border: 'none', borderRadius: '50%',
                        width: 22, height: 22, cursor: 'pointer', color: '#fff',
                        display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0,
                      }}
                    ><IconX size={8} /></button>
                  </div>
                ) : (
                  <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', color: 'var(--text-muted)', fontSize: 12 }}>
                    <input type="file" accept="image/*" style={{ display: 'none' }} onChange={handleImageSelect} />
                    <span style={{
                      padding: '7px 14px', borderRadius: 10,
                      background: 'var(--bg)',
                      boxShadow: '3px 3px 6px var(--sh-dark), -3px -3px 6px var(--sh-light)',
                      fontSize: 12, color: 'var(--text-sub)',
                    }}>+ 사진 첨부</span>
                  </label>
                )}
              </div>

              <div className="modal-actions">
                <button
                  className="sm-button"
                  onClick={() => setPinModal({ open: false, dateKey: '', memo: '', image: null })}
                >취소</button>
                <button className="sm-button" onClick={savePinMemo}>저장</button>
              </div>
            </div>
          </div>
        )}

        {/* ── 달성 통계 모달 ── */}
        {showStats && (() => {
          const now = new Date();
          const thisYear = now.getFullYear();
          const thisMonth = now.getMonth();  // 0-indexed
          const daysInMonth = new Date(thisYear, thisMonth + 1, 0).getDate();
          const firstDow = new Date(thisYear, thisMonth, 1).getDay();
          const monthLabel = `${thisYear}년 ${thisMonth + 1}월`;
          const DOWS = ['일','월','화','수','목','금','토'];

          if (calendars.length === 0) {
            return (
              <div className="modal-overlay" onClick={() => setShowStats(false)}>
                <p className="memos-empty" style={{ color: 'var(--text-muted)' }}>달력이 없어요.</p>
              </div>
            );
          }

          return (
            <div className="modal-overlay" onClick={() => setShowStats(false)}>
              <div className="stats-scroll-wrap" onClick={(e) => e.stopPropagation()}>

                {/* 카드 목록 (export 대상) */}
                <div id="stats-export-area" style={{ display: 'flex', flexDirection: 'column', gap: 16, background: 'transparent' }}>
                  {calendars.map(cal => {
                    const allDates = cal.completedDates || [];
                    const monthDoneSet = new Set(
                      allDates
                        .filter(d => {
                          const [y, m] = d.split('-').map(Number);
                          return y === thisYear && m === thisMonth + 1;
                        })
                        .map(d => Number(d.split('-')[2]))
                    );
                    const count = monthDoneSet.size;

                    // 미니 캘린더 셀 생성
                    const cells = [];
                    for (let i = 0; i < firstDow; i++) cells.push({ empty: true, day: null });
                    for (let d = 1; d <= daysInMonth; d++) cells.push({ empty: false, day: d, done: monthDoneSet.has(d) });

                    return (
                      <div key={cal.id} className="share-card">
                        <div className="share-card-bar" style={{ background: cal.color }} />

                        <p className="share-card-title">{cal.title}</p>
                        <p className="share-card-month">{monthLabel}</p>

                        {/* 미니 캘린더 */}
                        <div className="share-mini-cal">
                          <div className="share-mini-cal-header">
                            {DOWS.map(d => <span key={d} className="share-mini-dow">{d}</span>)}
                          </div>
                          <div className="share-mini-cal-grid">
                            {cells.map((c, i) => (
                              <div
                                key={i}
                                className={`share-mini-day${c.empty ? ' empty' : ''}${c.done ? ' done' : ''}`}
                                style={c.done ? {
                                  backgroundColor: cal.color,
                                  mixBlendMode: 'multiply',
                                  color: getContrastColor(cal.color),
                                  boxShadow: 'inset 3px 3px 6px rgba(0,0,0,0.12), inset -2px -2px 5px rgba(255,255,255,0.25)',
                                } : {}}
                              >
                                {c.empty ? '' : c.day}
                              </div>
                            ))}
                          </div>
                        </div>

                        {/* 하단 문구 */}
                        <div className="share-card-footer">
                          <span className="share-card-count" style={{ color: cal.color }}>{count}</span>
                          <span className="share-card-suffix">이번 달에 총 {count}회 달성했어요.</span>
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* export 버튼 */}
                <button
                  className={`stats-export-btn${statsExportStatus === 'copied' || statsExportStatus === 'saved' ? ' done' : ''}`}
                  onClick={exportStats}
                  disabled={statsExportStatus === 'loading'}
                >
                  {statsExportStatus === 'loading' && '…'}
                  {statsExportStatus === 'copied'  && '✓ 클립보드에 복사됨'}
                  {statsExportStatus === 'saved'   && '✓ 저장됨'}
                  {statsExportStatus === 'idle'    && 'export'}
                </button>
              </div>
            </div>
          );
        })()}

        {/* ── 전체 메모 모달 ── */}
        {showMemos && (() => {
          const allMemos = [];
          calendars.forEach(cal => {
            Object.entries(cal.pinnedDates || {}).forEach(([dateKey, pinData]) => {
              const memo = typeof pinData === 'string' ? pinData : (pinData?.memo || '');
              const img  = typeof pinData === 'string' ? null : (pinData?.image || null);
              if (memo || img) allMemos.push({ dateKey, memo, img, calTitle: cal.title, calColor: cal.color });
            });
          });
          allMemos.sort((a, b) => {
            const [ay,am,ad] = a.dateKey.split('-').map(Number);
            const [by,bm,bd] = b.dateKey.split('-').map(Number);
            return new Date(by,bm-1,bd) - new Date(ay,am-1,ad);
          });

          const grouped = {};
          allMemos.forEach(m => {
            const [y, mo] = m.dateKey.split('-');
            const key = `${y}.${String(mo).padStart(2,'0')}`;
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(m);
          });

          return (
            <div className="modal-overlay" onClick={() => setShowMemos(false)}>
              <div className="memos-modal-card" onClick={(e) => e.stopPropagation()}>
                <p className="memos-modal-title">전체 메모</p>
                {allMemos.length === 0 ? (
                  <p className="memos-empty">아직 메모가 없어요.</p>
                ) : (
                  Object.entries(grouped).map(([monthLabel, entries]) => (
                    <div key={monthLabel}>
                      <p className="memo-group-label">{monthLabel}</p>
                      {entries.map((m, i) => (
                        <div key={i} className="memo-entry">
                          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}>
                            <div style={{ width: 6, height: 6, borderRadius: '50%', background: m.calColor, flexShrink: 0 }} />
                            <span className="memo-entry-date">{m.calTitle} · {m.dateKey.replace(/-/g,'.')}</span>
                          </div>
                          {m.memo ? <p className="memo-entry-text">{m.memo}</p> : null}
                          {m.img  ? <img src={m.img} alt="" className="memo-entry-img" /> : null}
                        </div>
                      ))}
                    </div>
                  ))
                )}
              </div>
            </div>
          );
        })()}

      </div>
    );
  }

  /********************************************************
   * 4) 최종 렌더링
   ********************************************************/
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
  </script>
</body>
</html>
