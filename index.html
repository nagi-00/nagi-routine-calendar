<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 파비콘 -->
  <link rel="icon" href="./favi.ico" type="image/x-icon">

  <meta charset="UTF-8" />
  <title>𝐝 : ᴄᴀʟᴇɴᴅᴀʀ</title>

  <!-- React & Babel CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    @font-face {
      font-family: 'HJSS';
      src: url('./HJSS.ttf') format('truetype');
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'HJSS', sans-serif;
    }

    body {
      background-color: #e0e5ec;
      min-height: 100vh;
    }

    .app-container {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* ── 사이드바 ── */
    .sidebar {
      width: 300px;
      background: #e0e5ec;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      transition: transform 0.3s ease;
      z-index: 10;
      padding: 28px 24px;
      box-shadow: 8px 0 24px #b8bec7, -2px 0 10px #ffffff;
    }
    .sidebar.collapsed {
      transform: translateX(-300px);
    }

    .sidebar-title {
      font-size: 15px;
      font-weight: 500;
      color: #5a6478;
      margin-bottom: 20px;
      letter-spacing: 0.08em;
    }

    .toggle-button {
      position: fixed;
      left: 300px;
      top: 20px;
      z-index: 20;
      background: #e0e5ec;
      border: none;
      padding: 10px 14px;
      cursor: pointer;
      transition: left 0.3s ease;
      border-radius: 0 12px 12px 0;
      box-shadow: 6px 4px 12px #b8bec7, -1px -4px 10px #ffffff;
      color: #7a8499;
      font-size: 15px;
    }
    .toggle-button.collapsed {
      left: 0;
    }
    .toggle-button:active {
      box-shadow: inset 3px 3px 7px #b8bec7, inset -3px -3px 7px #ffffff;
    }

    /* ── 메인 컨테이너 ── */
    .main-content {
      flex: 1;
      padding: 40px 20px;
      margin-left: 300px;
      transition: margin-left 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .main-content.expanded {
      margin-left: 0;
    }

    /* ── 달력 카드 ── */
    .calendar-container {
      background: #e0e5ec;
      border-radius: 24px;
      padding: 28px 24px;
      width: 100%;
      max-width: 380px;
      box-shadow: 10px 10px 20px #b8bec7, -10px -10px 20px #ffffff;
    }

    .month-navigator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .month-title {
      font-size: 17px;
      font-weight: 500;
      color: #374151;
    }

    .nav-button {
      background: #e0e5ec;
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      color: #7a8499;
      font-size: 15px;
      border-radius: 10px;
      box-shadow: 4px 4px 8px #b8bec7, -4px -4px 8px #ffffff;
      transition: box-shadow 0.15s ease;
    }
    .nav-button:active {
      box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff;
    }

    .calendar-subtitle {
      font-size: 11px;
      color: #a0aab8;
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 0.06em;
    }

    /* ── 달력 그리드 ── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 36px);
      gap: 6px;
      justify-content: center;
    }

    .calendar-day {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border: none;
      cursor: pointer;
      border-radius: 50%;
      background: #e0e5ec;
      color: #4b5563;
      transition: box-shadow 0.15s ease;
    }
    .calendar-day.day-header {
      font-size: 11px;
      color: #9ca3af;
      cursor: default;
      background: transparent;
    }
    .calendar-day:not(.day-header):not(.day-empty):hover {
      box-shadow: 3px 3px 7px #b8bec7, -3px -3px 7px #ffffff;
    }

    /* ── 달력 리스트 (사이드바) ── */
    .calendar-list {
      margin-bottom: 20px;
    }

    .calendar-item {
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      transition: box-shadow 0.15s ease;
      color: #5a6478;
      font-size: 14px;
    }
    .calendar-item:hover {
      box-shadow: 3px 3px 8px #b8bec7, -3px -3px 8px #ffffff;
    }
    .calendar-item.selected {
      box-shadow: inset 3px 3px 7px #b8bec7, inset -3px -3px 7px #ffffff;
    }

    .calendar-item .delete-button {
      display: none;
    }
    .calendar-item:hover .delete-button {
      display: inline-block;
    }

    /* ── 새 캘린더 폼 ── */
    .new-calendar-form {
      margin-top: 20px;
    }

    .input-text {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      margin-bottom: 12px;
      background: #e0e5ec;
      box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff;
      color: #374151;
      outline: none;
      font-size: 14px;
    }
    .input-text::placeholder {
      color: #a0aab8;
    }

    .color-picker-container {
      display: flex;
      gap: 10px;
    }

    .color-picker {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #e0e5ec;
      box-shadow: 4px 4px 8px #b8bec7, -4px -4px 8px #ffffff;
      padding: 3px;
    }

    .add-button {
      flex-grow: 1;
      padding: 10px;
      background: #e0e5ec;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 4px 4px 8px #b8bec7, -4px -4px 8px #ffffff;
      color: #7a8499;
      font-size: 14px;
      transition: box-shadow 0.15s ease;
    }
    .add-button:active {
      box-shadow: inset 4px 4px 8px #b8bec7, inset -4px -4px 8px #ffffff;
    }

    /* ── 포커스 메시지 위젯 ── */
    .focus-widget {
      width: 100%;
      max-width: 380px;
      margin-top: 20px;
      background: #e0e5ec;
      border-radius: 20px;
      padding: 20px 24px;
      box-shadow: 8px 8px 16px #b8bec7, -8px -8px 16px #ffffff;
    }

    .focus-widget-label {
      font-size: 10px;
      color: #a0aab8;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .focus-widget-text {
      font-size: 13px;
      color: #6b7280;
      line-height: 1.75;
    }

    /* ── 비밀번호 화면 ── */
    .password-container {
      background: #e0e5ec;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 360px;
      margin: 100px auto;
      text-align: center;
      box-shadow: 10px 10px 20px #b8bec7, -10px -10px 20px #ffffff;
    }

    .password-title {
      font-size: 15px;
      color: #5a6478;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
  /********************************************************
   * 1) Firebase 설정 및 초기화
   ********************************************************/
  const firebaseConfig = {
    apiKey: "AIzaSyC7-uDX9U7jwXywrJTq2N29wv3bxmFSTlk",
    authDomain: "nagi-routine.firebaseapp.com",
    projectId: "nagi-routine",
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  /********************************************************
   * 2) 비밀번호 보호 컴포넌트 (PasswordGuard)
   ********************************************************/
  function PasswordGuard({ children }) {
    const [inputPwd, setInputPwd] = React.useState('');
    const [isAuthorized, setIsAuthorized] = React.useState(false);

    const checkPassword = () => {
      if (inputPwd === "demian") {
        setIsAuthorized(true);
      } else {
        alert("Please try again.");
      }
    };

    const handleKeyDown = (e) => {
      if (e.key === 'Enter') checkPassword();
    };

    if (!isAuthorized) {
      return (
        <div className="password-container">
          <p className="password-title">Enter the password.</p>
          <input
            type="password"
            className="input-text"
            value={inputPwd}
            onChange={(e) => setInputPwd(e.target.value)}
            onKeyDown={handleKeyDown}
          />
          <button
            className="add-button"
            style={{ width: '100%', marginTop: '12px' }}
            onClick={checkPassword}
          >
            ▼
          </button>
        </div>
      );
    }
    return children;
  }

  /********************************************************
   * 3) 달력 App
   ********************************************************/
  function App() {
    const [isSidebarCollapsed, setIsSidebarCollapsed] = React.useState(false);
    const [currentDate, setCurrentDate] = React.useState(new Date());
    const [calendars, setCalendars] = React.useState([]);
    const [selectedCalendar, setSelectedCalendar] = React.useState(null);

    const [newTitle, setNewTitle] = React.useState('');
    const [newColor, setNewColor] = React.useState('#9CA3AF');

    // 포커스 메시지
    const [focusMessage, setFocusMessage] = React.useState('');

    React.useEffect(() => {
      fetch('./demian_focus_messages (1).json')
        .then(res => res.json())
        .then(data => {
          const msgs = data.messages;
          if (msgs && msgs.length > 0) {
            setFocusMessage(msgs[Math.floor(Math.random() * msgs.length)]);
          }
        })
        .catch(() => {});
    }, []);

    /********************************************************
     * (3-1) Firestore 구독: 'calendars' 컬렉션
     ********************************************************/
    React.useEffect(() => {
      const unsubscribe = db.collection('calendars').onSnapshot(
        (snapshot) => {
          const loaded = [];
          snapshot.forEach(doc => {
            loaded.push({ id: doc.id, ...doc.data() });
          });
          setCalendars(loaded);
          if (loaded.length > 0 && !selectedCalendar) {
            setSelectedCalendar(loaded[0].id);
          }
        },
        (error) => { console.error("Firestore 구독 에러:", error); }
      );
      return () => unsubscribe();
    }, [selectedCalendar]);

    /********************************************************
     * (3-2) 새 캘린더 추가
     ********************************************************/
    const addCalendar = async () => {
      if (!newTitle.trim()) return;
      try {
        await db.collection('calendars').add({
          title: newTitle,
          color: newColor,
          completedDates: []
        });
        setNewTitle('');
        setNewColor('#9CA3AF');
      } catch (err) {
        console.error("달력 추가 중 에러:", err);
      }
    };

    /********************************************************
     * (3-3) 날짜 토글
     ********************************************************/
    const toggleDate = async (day) => {
      if (!selectedCalendar) return;
      const targetCal = calendars.find(cal => cal.id === selectedCalendar);
      if (!targetCal) return;

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth() + 1;
      const dateKey = `${year}-${month}-${day}`;

      const dates = [...(targetCal.completedDates || [])];
      const idx = dates.indexOf(dateKey);
      if (idx === -1) { dates.push(dateKey); } else { dates.splice(idx, 1); }

      try {
        await db.collection('calendars').doc(selectedCalendar).update({ completedDates: dates });
      } catch (err) {
        console.error("날짜 토글 중 에러:", err);
      }
    };

    /********************************************************
     * (3-4) 캘린더 삭제
     ********************************************************/
    const deleteCalendar = async (calendarId) => {
      const ok = window.confirm("정말 이 캘린더를 삭제할까?");
      if (!ok) return;
      try {
        await db.collection('calendars').doc(calendarId).delete();
        if (selectedCalendar === calendarId) setSelectedCalendar(null);
      } catch (err) {
        console.error("캘린더 삭제 중 오류:", err);
      }
    };

    /********************************************************
     * (3-5) 월 이동, 사이드바 토글
     ********************************************************/
    const navigateMonth = (direction) => {
      setCurrentDate(prev => {
        const d = new Date(prev);
        d.setMonth(d.getMonth() + (direction === 'prev' ? -1 : 1));
        return d;
      });
    };

    const toggleSidebar = () => setIsSidebarCollapsed(v => !v);

    /********************************************************
     * (3-6) 현재 선택된 캘린더
     ********************************************************/
    const currentCalendar = calendars.find(cal => cal.id === selectedCalendar)
                          || { completedDates: [], color: '#9CA3AF' };

    const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();
    const firstDay    = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();

    /********************************************************
     * (3-7) 최종 렌더링
     ********************************************************/
    return (
      <div className="app-container">
        {/* 사이드바 */}
        <div className={`sidebar ${isSidebarCollapsed ? 'collapsed' : ''}`}>
          <p className="sidebar-title">List</p>

          <div className="calendar-list">
            {calendars.map(cal => (
              <div
                key={cal.id}
                className={`calendar-item ${selectedCalendar === cal.id ? 'selected' : ''}`}
              >
                <span onClick={() => setSelectedCalendar(cal.id)}>
                  {cal.title}
                </span>
                <button
                  className="delete-button"
                  onClick={() => deleteCalendar(cal.id)}
                  style={{ background: 'none', border: 'none', color: '#EF4444', cursor: 'pointer', marginLeft: '8px' }}
                >
                  ✕
                </button>
              </div>
            ))}
          </div>

          <div className="new-calendar-form">
            <input
              type="text"
              className="input-text"
              placeholder="Title here"
              value={newTitle}
              onChange={(e) => setNewTitle(e.target.value)}
            />
            <div className="color-picker-container">
              <input
                type="color"
                className="color-picker"
                value={newColor}
                onChange={(e) => setNewColor(e.target.value)}
              />
              <button className="add-button" onClick={addCalendar}>Add</button>
            </div>
          </div>
        </div>

        {/* 사이드바 토글 버튼 */}
        <button
          className={`toggle-button ${isSidebarCollapsed ? 'collapsed' : ''}`}
          onClick={toggleSidebar}
        >
          {isSidebarCollapsed ? '→' : '←'}
        </button>

        {/* 메인 컨텐츠 */}
        <div className={`main-content ${isSidebarCollapsed ? 'expanded' : ''}`}>

          {/* 달력 카드 */}
          <div className="calendar-container">
            <div className="month-navigator">
              <button className="nav-button" onClick={() => navigateMonth('prev')}>←</button>
              <span className="month-title">
                {currentDate.toLocaleString('en-US', { month: 'long', year: 'numeric' })}
              </span>
              <button className="nav-button" onClick={() => navigateMonth('next')}>→</button>
            </div>

            <p className="calendar-subtitle">내면의 성장을 향한 여정</p>

            {/* 요일 헤더 */}
            <div className="calendar-grid" style={{ marginBottom: '8px' }}>
              {['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d => (
                <div key={d} className="calendar-day day-header">{d}</div>
              ))}
            </div>

            {/* 날짜 그리드 */}
            <div className="calendar-grid">
              {Array(firstDay).fill(null).map((_, i) => (
                <div key={`empty-${i}`} className="calendar-day day-empty" />
              ))}
              {Array(daysInMonth).fill(null).map((_, i) => {
                const day = i + 1;
                const year  = currentDate.getFullYear();
                const month = currentDate.getMonth() + 1;
                const dateKey = `${year}-${month}-${day}`;
                const isCompleted = currentCalendar.completedDates.includes(dateKey);
                return (
                  <button
                    key={day}
                    className="calendar-day"
                    onClick={() => toggleDate(day)}
                    style={{
                      backgroundColor: isCompleted ? currentCalendar.color : '#e0e5ec',
                      color: isCompleted ? 'white' : '#4B5563',
                      boxShadow: isCompleted
                        ? 'inset 3px 3px 6px rgba(0,0,0,0.18), inset -2px -2px 5px rgba(255,255,255,0.15)'
                        : ''
                    }}
                  >
                    {day}
                  </button>
                );
              })}
            </div>
          </div>

          {/* 포커스 메시지 위젯 */}
          {focusMessage && (
            <div className="focus-widget">
              <p className="focus-widget-label">focus</p>
              <p className="focus-widget-text">{focusMessage}</p>
            </div>
          )}

        </div>
      </div>
    );
  }

  /********************************************************
   * 4) 최종 렌더링
   ********************************************************/
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(
    <PasswordGuard>
      <App />
    </PasswordGuard>
  );
  </script>
</body>
</html>
