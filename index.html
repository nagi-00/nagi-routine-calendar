<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 파비콘 -->
  <link rel="icon" href="./favi.ico" type="image/x-icon">

  <meta charset="UTF-8" />
  <title>𝐝 : ᴄᴀʟᴇɴᴅᴀʀ</title>

  <!-- React & Babel CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Firebase (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- dom-to-image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>

  <style>
    @font-face {
      font-family: 'HJSS';
      src: url('./HJSS.ttf') format('truetype');
    }

    /* ── 색상 토큰 ── */
    :root {
      --bg:          #EEEAE3;
      --sh-dark:     #CEC8BE;
      --sh-light:    #FFFFFF;
      --text-pri:    #2C2825;
      --text-sub:    #8C8680;
      --text-muted:  #B8B2AA;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'HJSS', sans-serif;
    }

    body {
      background-color: var(--bg);
      min-height: 100vh;
    }

    .app-container {
      display: flex;
      min-height: 100vh;
      position: relative;
    }

    /* ── 사이드바 ── */
    .sidebar {
      width: 300px;
      background: var(--bg);
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      transition: transform 0.3s ease;
      z-index: 10;
      padding: 28px 24px;
      box-shadow: 8px 0 24px var(--sh-dark), -2px 0 10px var(--sh-light);
      overflow-y: auto;
    }
    .sidebar.collapsed { transform: translateX(-300px); }
    .sidebar.right-side {
      left: auto;
      right: 0;
      box-shadow: -8px 0 24px var(--sh-dark), 2px 0 10px var(--sh-light);
    }
    .sidebar.right-side.collapsed { transform: translateX(300px); }

    .sidebar-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 20px;
      letter-spacing: 0.08em;
    }

    .toggle-button {
      position: fixed;
      left: 300px;
      top: 20px;
      z-index: 20;
      background: var(--bg);
      border: none;
      padding: 10px 14px;
      cursor: pointer;
      transition: left 0.3s ease, right 0.3s ease;
      border-radius: 0 12px 12px 0;
      box-shadow: 6px 4px 12px var(--sh-dark), -1px -4px 10px var(--sh-light);
      color: var(--text-sub);
      font-size: 15px;
    }
    .toggle-button.collapsed { left: 0; }
    .toggle-button.right-side {
      left: auto;
      right: 300px;
      border-radius: 12px 0 0 12px;
      box-shadow: -6px 4px 12px var(--sh-dark), 1px -4px 10px var(--sh-light);
    }
    .toggle-button.right-side.collapsed { right: 0; }
    .toggle-button:active {
      box-shadow: inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
    }

    /* ── 메인 컨테이너 ── */
    .main-content {
      flex: 1;
      padding: 40px 20px;
      margin-left: 300px;
      transition: margin-left 0.3s ease, margin-right 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .main-content.expanded {
      margin-left: 0;
    }
    .main-content.right-sidebar {
      margin-left: 0;
      margin-right: 300px;
    }
    .main-content.right-sidebar.expanded {
      margin-left: 0;
    }

    /* ── 달력 카드 ── */
    .calendar-container {
      background: var(--bg);
      border-radius: 24px;
      padding: 28px 24px;
      width: 380px;
      flex-shrink: 0;
      box-shadow: 10px 10px 20px var(--sh-dark), -10px -10px 20px var(--sh-light);
    }

    .month-navigator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .month-title {
      font-size: 17px;
      font-weight: 500;
      color: var(--text-pri);
    }

    .nav-button {
      background: var(--bg);
      border: none;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--text-sub);
      font-size: 15px;
      border-radius: 10px;
      box-shadow: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
      transition: box-shadow 0.15s ease;
    }
    .nav-button:active {
      box-shadow: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
    }

    .calendar-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 0.06em;
    }

    /* ── 달력 그리드 ── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 36px);
      gap: 6px;
      justify-content: center;
    }

    /* 날짜 셀 래퍼 — 숫자 + pin 점 */
    .day-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .calendar-day {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      border: none;
      cursor: pointer;
      border-radius: 50%;
      background: transparent;
      color: var(--text-pri);
      transition: box-shadow 0.15s ease;
      touch-action: manipulation;
      user-select: none;
    }
    .calendar-day.day-header {
      font-size: 11px;
      color: var(--text-muted);
      cursor: default;
      background: transparent;
    }
    .calendar-day:not(.day-header):not(.day-empty):hover {
      box-shadow: 3px 3px 7px var(--sh-dark), -3px -3px 7px var(--sh-light);
    }

    .pin-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      opacity: 0.75;
    }
    .calendar-day:disabled {
      cursor: default;
      opacity: 1;
    }

    /* ── 달력 리스트 (사이드바) ── */
    .calendar-list {
      margin-bottom: 20px;
    }

    .calendar-item {
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      transition: box-shadow 0.15s ease;
      color: var(--text-sub);
      font-size: 14px;
      gap: 8px;
    }
    .calendar-item:hover {
      box-shadow: 3px 3px 8px var(--sh-dark), -3px -3px 8px var(--sh-light);
    }
    .calendar-item.selected {
      box-shadow: inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
    }

    .cal-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 0;
    }
    .cal-color-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .cal-title-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cal-item-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .calendar-item:hover .cal-item-actions {
      opacity: 1;
      pointer-events: auto;
    }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      color: var(--text-sub);
    }
    .icon-btn.del:hover {
      color: #C0796A;
    }

    /* ── 인라인 편집 폼 ── */
    .cal-edit-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 8px;
      box-shadow: inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
    }
    .cal-edit-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    /* ── 새 캘린더 폼 ── */
    .new-calendar-form {
      margin-top: 20px;
    }

    .input-text {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      margin-bottom: 12px;
      background: var(--bg);
      box-shadow: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
      color: var(--text-pri);
      outline: none;
      font-size: 14px;
      font-family: 'HJSS', sans-serif;
    }
    .input-text::placeholder {
      color: var(--text-muted);
    }

    .input-text-sm {
      flex: 1;
      padding: 7px 10px;
      border: none;
      border-radius: 10px;
      background: var(--bg);
      box-shadow: inset 3px 3px 7px var(--sh-dark), inset -3px -3px 7px var(--sh-light);
      color: var(--text-pri);
      outline: none;
      font-size: 13px;
      font-family: 'HJSS', sans-serif;
      min-width: 0;
    }

    .color-picker-container {
      display: flex;
      gap: 10px;
    }

    .color-picker {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: var(--bg);
      box-shadow: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
      padding: 3px;
    }

    .color-picker-sm {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: var(--bg);
      box-shadow: 3px 3px 6px var(--sh-dark), -3px -3px 6px var(--sh-light);
      padding: 2px;
      flex-shrink: 0;
    }

    .add-button {
      flex-grow: 1;
      padding: 10px;
      background: var(--bg);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 4px 4px 8px var(--sh-dark), -4px -4px 8px var(--sh-light);
      color: var(--text-sub);
      font-size: 14px;
      transition: box-shadow 0.15s ease;
      font-family: 'HJSS', sans-serif;
    }
    .add-button:active {
      box-shadow: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
    }

    .sm-button {
      padding: 6px 10px;
      background: var(--bg);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 3px 3px 6px var(--sh-dark), -3px -3px 6px var(--sh-light);
      color: var(--text-sub);
      font-size: 12px;
      transition: box-shadow 0.15s ease;
      font-family: 'HJSS', sans-serif;
      white-space: nowrap;
    }
    .sm-button:active {
      box-shadow: inset 3px 3px 6px var(--sh-dark), inset -3px -3px 6px var(--sh-light);
    }

    /* ── 포커스 메시지 위젯 ── */
    .focus-widget {
      width: 100%;
      max-width: 380px;
      margin-top: 20px;
      background: var(--bg);
      border-radius: 20px;
      padding: 20px 24px;
      box-shadow: 8px 8px 16px var(--sh-dark), -8px -8px 16px var(--sh-light);
    }

    .focus-widget-label {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .focus-widget-text {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.75;
    }

    /* ── export 버튼 ── */
    .export-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      padding: 10px 20px;
      background: var(--bg);
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 5px 5px 10px var(--sh-dark), -5px -5px 10px var(--sh-light);
      color: var(--text-sub);
      font-size: 12px;
      letter-spacing: 0.08em;
      transition: box-shadow 0.15s ease, color 0.2s ease;
      font-family: 'HJSS', sans-serif;
    }
    .export-btn:hover {
      color: var(--text-pri);
    }
    .export-btn:active {
      box-shadow: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
    }
    .export-btn.done {
      color: #6b9e7a;
    }

    /* ── 포스트잇 ── */
    .postit-col {
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding-top: 28px;
      flex-shrink: 0;
    }

    .postit {
      width: 168px;
      background: var(--bg);
      background-image: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 19px,
        rgba(206, 200, 190, 0.22) 19px,
        rgba(206, 200, 190, 0.22) 20px
      );
      border-radius: 2px 2px 10px 10px;
      padding: 32px 14px 16px;
      box-shadow: 4px 8px 20px rgba(206,200,190,0.95), -3px -2px 10px rgba(255,255,255,0.85);
      position: relative;
      overflow: hidden;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .postit:hover {
      box-shadow: 6px 12px 28px rgba(206,200,190,1), -4px -3px 12px rgba(255,255,255,0.9);
    }

    /* 압정 */
    .postit-tack {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      z-index: 2;
      box-shadow:
        0 2px 5px rgba(0,0,0,0.22),
        inset 0 1px 3px rgba(255,255,255,0.65),
        inset 0 -1px 2px rgba(0,0,0,0.18);
    }

    /* 고스트 날짜 숫자 */
    .postit-day-bg {
      position: absolute;
      bottom: -6px;
      right: 8px;
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      opacity: 0.055;
      color: #2C2825;
      user-select: none;
      pointer-events: none;
      letter-spacing: -0.02em;
    }

    .postit-date {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .postit-memo {
      font-size: 12px;
      color: var(--text-pri);
      line-height: 20px;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
      z-index: 1;
    }

    .postit-actions {
      display: none;
      position: absolute;
      top: 10px;
      right: 8px;
      gap: 4px;
      z-index: 3;
    }
    .postit:hover .postit-actions {
      display: flex;
    }

    .postit-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #EEEAE3;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 5px var(--sh-dark), -1px -1px 4px var(--sh-light);
      color: var(--text-muted);
      transition: color 0.15s ease, box-shadow 0.15s ease;
      padding: 0;
    }
    .postit-btn:hover {
      color: var(--text-sub);
      box-shadow: 3px 3px 7px var(--sh-dark), -2px -2px 5px var(--sh-light);
    }
    .postit-btn.del:hover {
      color: #C0796A;
    }
    .postit-btn:active {
      box-shadow: inset 2px 2px 4px var(--sh-dark), inset -1px -1px 3px var(--sh-light);
    }

    /* ── Pin 모달 ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(238, 234, 227, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }

    .modal-card {
      background: var(--bg);
      border-radius: 20px;
      padding: 28px 26px;
      width: 300px;
      box-shadow: 12px 12px 24px var(--sh-dark), -12px -12px 24px var(--sh-light);
    }

    .modal-date-label {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      margin-bottom: 4px;
    }

    .modal-cal-label {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    .modal-textarea {
      width: 100%;
      min-height: 110px;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      background: var(--bg);
      box-shadow: inset 4px 4px 8px var(--sh-dark), inset -4px -4px 8px var(--sh-light);
      color: var(--text-pri);
      outline: none;
      font-size: 13px;
      font-family: 'HJSS', sans-serif;
      resize: none;
      line-height: 1.65;
      margin-bottom: 16px;
    }
    .modal-textarea::placeholder {
      color: var(--text-muted);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .modal-hint {
      font-size: 10px;
      color: var(--text-muted);
      margin-bottom: 12px;
      letter-spacing: 0.04em;
    }

    /* ── 비밀번호 화면 (구조 유지용, 사용 안 함) ── */
    .password-container {
      background: var(--bg);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 360px;
      margin: 100px auto;
      text-align: center;
      box-shadow: 10px 10px 20px var(--sh-dark), -10px -10px 20px var(--sh-light);
    }

    .password-title {
      font-size: 15px;
      color: var(--text-sub);
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }

    /* ── 설정 패널 ── */
    .settings-panel {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--sh-dark);
    }
    .settings-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-sub);
      letter-spacing: 0.06em;
      margin-bottom: 0;
      padding: 4px 0;
      background: none;
      border: none;
      width: 100%;
      font-family: 'HJSS', sans-serif;
    }
    .settings-toggle:hover { color: var(--text-pri); }
    .settings-body { margin-top: 16px; }
    .settings-section-label {
      font-size: 9px;
      color: var(--text-muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .theme-dots {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .theme-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .focus-msg-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.5;
    }
    .focus-msg-text {
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }
    .focus-add-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      align-items: flex-end;
    }
    .focus-add-textarea {
      flex: 1;
      min-height: 44px;
      border: none;
      border-radius: 10px;
      padding: 8px 10px;
      background: var(--bg);
      box-shadow: inset 3px 3px 6px var(--sh-dark), inset -3px -3px 6px var(--sh-light);
      color: var(--text-pri);
      outline: none;
      font-size: 12px;
      font-family: 'HJSS', sans-serif;
      resize: none;
      line-height: 1.5;
    }

    /* ── 포커스 위젯 헤더 행 ── */
    .focus-widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .focus-refresh-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 6px;
      transition: color 0.15s;
      line-height: 1;
    }
    .focus-refresh-btn:hover {
      color: var(--text-sub);
    }

    /* ── 체크리스트 ── */
    .checklist-card {
      background: var(--bg);
      border-radius: 18px;
      padding: 16px 18px;
      margin-top: 14px;
      box-shadow: 6px 6px 14px var(--sh-dark), -6px -6px 14px var(--sh-light);
      width: 100%;
      box-sizing: border-box;
    }
    .checklist-title {
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--sh-dark);
    }
    .checklist-item:last-child { border-bottom: none; }
    .checklist-check {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: none;

<body>
  <div id="root"></div>

  <script type="text/babel">
  /********************************************************

  const firebaseConfig = {
    apiKey: "AIzaSyC7-uDX9U7jwXywrJTq2N29wv3bxmFSTlk",

  /********************************************************
   * 1-1) 비밀번호 보호 컴포넌트 (PasswordGuard)
   ********************************************************/
  function PasswordGuard({ children }) {
    const [inputPwd, setInputPwd] = React.useState('');
    const [isAuthorized, setIsAuthorized] = React.useState(false);

    const checkPassword = () => {
      if (inputPwd === "demian") {
        setIsAuthorized(true);
      } else {
        alert("Please try again.");
      }
    };

    const handleKeyDown = (e) => {

    };

    if (!isAuthorized) {
      return (
        <div className="password-container">
          <p className="password-title">Enter the password.</p>
          <input
            type="password"
            className="input-text"
            value={inputPwd}
            onChange={(e) => setInputPwd(e.target.value)}

            style={{ width: '100%', marginTop: '12px' }}

            ▼

    }
    return children;
  }

  /********************************************************

  const IconPen = ({ size = 11 }) => (

    </svg>

  // 배경색 밝기에 따라 텍스트 색상 자동 결정
  const getContrastColor = (hex) => {
    if (!hex || hex.length < 7) return '#2C2825';
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return luminance > 0.55 ? '#2C2825' : '#FFFFFF';
  };

  /********************************************************
   * 2) 상수 및 유틸
   ********************************************************/
  const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const THEMES = [
    { name: 'Sand',      bg: '#EEEAE3', dark: '#CEC8BE', light: '#FFFFFF' },
    { name: 'Parchment', bg: '#E8E2D8', dark: '#C8C2B8', light: '#FFFEF8' },
    { name: 'Cream',     bg: '#F2EDE6', dark: '#D2CDC6', light: '#FFFFFF' },
    { name: 'Mist',      bg: '#E6EAE8', dark: '#C6CAC8', light: '#FFFFFF' },
    { name: 'Rose',      bg: '#EDE8E8', dark: '#CDC8C8', light: '#FFFFFF' },
  ];

  const applyTheme = (s) => {
    document.documentElement.style.setProperty('--bg', s.bgColor);
    document.documentElement.style.setProperty('--sh-dark', s.bgDark);
    document.documentElement.style.setProperty('--sh-light', s.bgLight);
  };

  // ── 팔레트 컬러 유틸 ──
  const hslToHex = (h, s, l) => {
    h = ((h % 360) + 360) % 360;
    s /= 100; l /= 100;
    const a = s * Math.min(l, 1 - l);
    const f = n => {
      const k = (n + h / 30) % 12;
      return Math.round(255 * (l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1))).toString(16).padStart(2, '0');
    };
    return '#' + f(0) + f(8) + f(4);
  };

  const generateHarmoniousColors = (baseHue, count) => {
    if (count === 0) return [];
    const sVals = [28, 22, 34, 25, 30, 20];
    const lVals = [74, 68, 80, 72, 77, 66];
    const hueRange = Math.min(count - 1, 5) * 8;
    return Array.from({ length: count }, (_, i) => {
      const hue = count === 1 ? baseHue : ((baseHue - hueRange / 2 + i * hueRange / (count - 1)) + 360) % 360;
      return hslToHex(hue, sVals[i % sVals.length], lVals[i % lVals.length]);
    });
  };

  const PALETTE_PRESETS = [
    { name: 'Greenery', label: '초록', baseHue: 125, swatch: '#A8C9A8' },
    { name: 'Lavender', label: '라벤더', baseHue: 268, swatch: '#BDB5D8' },
    { name: 'Sunrise',  label: '노을',  baseHue: 22,  swatch: '#DDB8A8' },
    { name: 'Ocean',    label: '오션',  baseHue: 205, swatch: '#A4BDD0' },
    { name: 'Rose',     label: '로즈',  baseHue: 345, swatch: '#D8ADB6' },
    { name: 'Mocha',    label: '모카',  baseHue: 30,  swatch: '#C8B89E' },
  ];

  const defaultSettings = {
    bgColor: '#EEEAE3',
    bgDark: '#CEC8BE',
    bgLight: '#FFFFFF',
    subtitle: '내면의 성장을 향한 여정',
    sidebarPosition: 'left',
    blendMode: 'multiply',
    weekStart: 'sun',
    focusMessages: [],
  };

  /********************************************************
   * 3) 앱 컴포넌트
   ********************************************************/

  function App() {
    const [isSidebarCollapsed, setIsSidebarCollapsed] = React.useState(() => window.innerWidth <= 640);
    const [currentDate, setCurrentDate] = React.useState(new Date());
    const [calendars, setCalendars] = React.useState([]);
    const [selectedCalendar, setSelectedCalendar] = React.useState(null);

    const [newTitle, setNewTitle] = React.useState('');
    const [newColor, setNewColor] = React.useState('#9CA3AF');

    // 인라인 편집
    const [editingCalId, setEditingCalId] = React.useState(null);
    const [editTitle, setEditTitle] = React.useState('');
    const [editColor, setEditColor] = React.useState('#9CA3AF');

    // 설정
    const [settings, setSettings] = React.useState(defaultSettings);
    const [isSettingsOpen, setIsSettingsOpen] = React.useState(false);
    const [newFocusMsg, setNewFocusMsg] = React.useState('');
    const [editSubtitle, setEditSubtitle] = React.useState('');
    const [editingFocusIdx, setEditingFocusIdx] = React.useState(null);
    const [editingFocusText, setEditingFocusText] = React.useState('');

    // 포커스 메시지
    const [focusMessage, setFocusMessage] = React.useState('');

    // export 상태: 'idle' | 'loading' | 'copied' | 'saved' | 'download'
    const [exportStatus, setExportStatus] = React.useState('idle');
    const [exportBlobUrl, setExportBlobUrl] = React.useState(null);

    // Pin 모달
    const defaultImgEdit = { rotate: 0, flipH: false, flipV: false, scale: 1.0, offsetX: 0, offsetY: 0 };
    const [pinModal, setPinModal] = React.useState({ open: false, dateKey: '', memo: '', image: null, imgEdit: defaultImgEdit });
    const imgDragRef = React.useRef({ active: false, startX: 0, startY: 0, baseOffX: 0, baseOffY: 0 });

    // 전체 메모 모달
    const [showMemos, setShowMemos] = React.useState(false);

    // 체크리스트
    const [checklist, setChecklist] = React.useState([]);
    const [newCheckItem, setNewCheckItem] = React.useState('');
    const [editingCheckId, setEditingCheckId] = React.useState(null);
    const [editingCheckText, setEditingCheckText] = React.useState('');

    // 모아보기: 4개 초과 시 대표 캘린더 IDs (null = 순서대로 앞 4개)
    const [overviewPicks, setOverviewPicks] = React.useState(null);

    // 롱프레스 감지 ref
    const pressTimer = React.useRef(null);
    const didLongPress = React.useRef(false);

    // 팔레트 일괄 변경 — 이전 색상 백업 (1회 되돌리기)
    const [lastCalColors, setLastCalColors] = React.useState(null);
    const [selectedPalette, setSelectedPalette] = React.useState(null);

    // 달력 순서 변경 드래그
    const [dragOverId, setDragOverId] = React.useState(null);
    const draggedIdRef = React.useRef(null);

    /********************************************************
     * (3-0) 데이터 로드 (Web: localStorage + Firestore)
     ********************************************************/
    // Settings: localStorage
    React.useEffect(() => {
      const saved = localStorage.getItem('nagi-settings');
      const s = saved ? { ...defaultSettings, ...JSON.parse(saved) } : { ...defaultSettings };
      setSettings(s);
      setEditSubtitle(s.subtitle);
      applyTheme(s);
      setChecklist(s.checklist || []);
      if (s.focusMessages && s.focusMessages.length > 0) {
        setFocusMessage(s.focusMessages[Math.floor(Math.random() * s.focusMessages.length)]);
      } else {
        // Default focus messages from JSON if none saved
        fetch('./demian_focus_messages (1).json')
          .then(r => r.json())
          .then(data => {
            const msgs = data.messages || [];
            if (msgs.length > 0) {
              const newS = { ...s, focusMessages: msgs };
              setSettings(newS);
              setFocusMessage(msgs[Math.floor(Math.random() * msgs.length)]);
              localStorage.setItem('nagi-settings', JSON.stringify(newS));
            }
          })
          .catch(() => {});
      }
    }, []);

    // Calendars: Firestore (로컬 순서 적용)
    React.useEffect(() => {
      const unsubscribe = db.collection('calendars').onSnapshot(
        (snapshot) => {
          const loaded = [];
          snapshot.forEach(doc => {
            loaded.push({ id: doc.id, ...doc.data() });
          });
          // localStorage에 저장된 순서 적용
          const savedOrder = JSON.parse(localStorage.getItem('nagi-cal-order') || '[]');
          if (savedOrder.length > 0) {
            loaded.sort((a, b) => {
              const ai = savedOrder.indexOf(a.id);
              const bi = savedOrder.indexOf(b.id);
              if (ai === -1 && bi === -1) return 0;
              if (ai === -1) return 1;
              if (bi === -1) return -1;
              return ai - bi;
            });
          }
          setCalendars(loaded);
          setSelectedCalendar(prev => prev || (loaded.length > 0 ? loaded[0].id : null));
        },
        (error) => { console.error('Firestore 구독 에러:', error); }
      );
      return () => unsubscribe();
    }, []);

    // 클립보드 붙여넣기 (모달 열려있을 때)
    React.useEffect(() => {
      if (!pinModal.open) return;
      const handlePaste = (e) => {
        const items = e.clipboardData?.items;
        if (!items) return;
        for (const item of items) {
          if (item.type.startsWith('image/')) {
            const file = item.getAsFile();
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              setPinModal(prev => ({ ...prev, image: ev.target.result, imgEdit: defaultImgEdit }));
            };
            reader.readAsDataURL(file);
            break;
          }
        }
      };
      window.addEventListener('paste', handlePaste);
      return () => window.removeEventListener('paste', handlePaste);
    }, [pinModal.open]);

    /********************************************************
     * (3-1) 저장 헬퍼 (Web)
     ********************************************************/
    const saveSettings = (newSetts) => {
      localStorage.setItem('nagi-settings', JSON.stringify(newSetts));
      setSettings(newSetts);
      applyTheme(newSetts);
    };

    /********************************************************
     * (3-1b) 체크리스트 핸들러
     ********************************************************/
    const saveChecklist = (newList) => {
      setChecklist(newList);
      const newSetts = { ...settings, checklist: newList };
      saveSettings(newSetts);
    };

    const addCheckItem = () => {
      if (!newCheckItem.trim()) return;
      saveChecklist([...checklist, { id: genId(), text: newCheckItem.trim(), done: false, starred: false }]);
      setNewCheckItem('');
    };

    const toggleCheckItem = (id) => {
      saveChecklist(checklist.map(i => i.id === id ? { ...i, done: !i.done } : i));
    };

    const deleteCheckItem = (id) => {
      saveChecklist(checklist.filter(i => i.id !== id));
    };

    const editCheckItem = (id, text) => {
      setEditingCheckId(id);
      setEditingCheckText(text);
    };

    const saveCheckEdit = (id) => {
      if (!editingCheckText.trim()) return;
      saveChecklist(checklist.map(i => i.id === id ? { ...i, text: editingCheckText.trim() } : i));
      setEditingCheckId(null);
      setEditingCheckText('');
    };

    const cancelCheckEdit = () => {
      setEditingCheckId(null);
      setEditingCheckText('');
    };

    const starCheckItem = (id) => {
      saveChecklist(checklist.map(i => i.id === id ? { ...i, starred: !i.starred } : i));
    };

    /********************************************************
     * (3-2) export
     ********************************************************/
    const exportCalendar = async () => {
      if (exportStatus === 'loading') return;
      setExportStatus('loading');
      try {
        const el = document.getElementById('calendar-export-area');
        const navBtns = el.querySelectorAll('.nav-button');
        navBtns.forEach(b => { b.style.visibility = 'hidden'; });
        await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

        let blob;
        try {
          const scale = 2;
          blob = await domtoimage.toBlob(el, {
            bgcolor: settings.bgColor,
            width:  el.offsetWidth  * scale,
            height: el.offsetHeight * scale,
            style: {
              transform: `scale(${scale})`,
              transformOrigin: 'top left',
              width:  el.offsetWidth  + 'px',
              height: el.offsetHeight + 'px',
            },
          });
        } finally {
          navBtns.forEach(b => { b.style.visibility = ''; });
        }

        let status = 'copied';
        try {
          await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
        } catch {
          // 클립보드 실패 시 다운로드 버튼 제공
          if (exportBlobUrl) URL.revokeObjectURL(exportBlobUrl);
          const url = URL.createObjectURL(blob);
          setExportBlobUrl(url);
          status = 'download';
        }

      } catch (err) {

        setExportStatus('idle');
      }
    };

    const applyImageTransforms = (dataUrl, { rotate, flipH, flipV, scale, offsetX = 0, offsetY = 0 }) => {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          if (offsetX !== 0 || offsetY !== 0) {
            // 패닝 있을 때: 프리뷰 뷰포트(300×160)로 고정 크롭
            const VW = 300, VH = 160;
            const fitScale = Math.min(VW / img.width, VH / img.height) || 1;
            const totalScale = fitScale * scale;
            const canvas = document.createElement('canvas');
            canvas.width = VW; canvas.height = VH;
            const ctx = canvas.getContext('2d');
            ctx.translate(VW / 2 + offsetX, VH / 2 + offsetY);
            ctx.rotate((rotate * Math.PI) / 180);
            ctx.scale(flipH ? -totalScale : totalScale, flipV ? -totalScale : totalScale);
            ctx.drawImage(img, -img.width / 2, -img.height / 2);
            resolve(canvas.toDataURL('image/jpeg', 0.88));
          } else {
            // 기존 방식: 전체 이미지 변환
            const rad = (rotate * Math.PI) / 180;
            const sin = Math.abs(Math.sin(rad));
            const cos = Math.abs(Math.cos(rad));
            const sw = img.width * scale;
            const sh = img.height * scale;
            const cw = Math.round(sw * cos + sh * sin);
            const ch = Math.round(sw * sin + sh * cos);
            const canvas = document.createElement('canvas');
            canvas.width = cw; canvas.height = ch;
            const ctx = canvas.getContext('2d');
            ctx.translate(cw / 2, ch / 2);
            ctx.rotate(rad);
            ctx.scale(flipH ? -scale : scale, flipV ? -scale : scale);
            ctx.drawImage(img, -img.width / 2, -img.height / 2);
            resolve(canvas.toDataURL('image/jpeg', 0.88));
          }
        };
        img.src = dataUrl;
      });
    };

      const newPinnedDates = { ...(currentCalendar.pinnedDates || {}) };
      if (pinModal.memo.trim() || img) {

      const targetId = item?.dataset?.calId;
      if (targetId && targetId !== draggedIdRef.current) setDragOverId(targetId);
      else if (!targetId) setDragOverId(null);
    };
    const handleDragHandlePointerUp = () => {
      document.body.style.cursor = '';
      const fromId = draggedIdRef.current;
      if (fromId && dragOverId && fromId !== dragOverId) {
        const fromIdx = calendars.findIndex(c => c.id === fromId);
        const toIdx   = calendars.findIndex(c => c.id === dragOverId);
        if (fromIdx >= 0 && toIdx >= 0) {
          const newCals = [...calendars];
          const [moved] = newCals.splice(fromIdx, 1);
          newCals.splice(toIdx, 0, moved);
          setCalendars(newCals);
          localStorage.setItem('nagi-cal-order', JSON.stringify(newCals.map(c => c.id)));

    const rawFirstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
    const firstDay    = weekStart === 'mon' ? (rawFirstDay + 6) % 7 : rawFirstDay;
    const todayObj    = new Date();
    const todayDay    = (todayObj.getFullYear() === currentDate.getFullYear() && todayObj.getMonth() === currentDate.getMonth())

                          imgDragRef.current.active = false;
                          e.currentTarget.releasePointerCapture(e.pointerId);
                          e.currentTarget.style.cursor = 'grab';
                        }}
                      >
                        {/* 블러 배경 */}
                        <img
                          src={pinModal.image}
                          alt=""
                          style={{
                            position: 'absolute', inset: 0, width: '100%', height: '100%',
                            objectFit: 'cover', filter: 'blur(14px)', transform: 'scale(1.15)',
                            pointerEvents: 'none', opacity: 0.85,
                          }}
                        />
                        {/* 메인 이미지 */}
                        <img
                          src={pinModal.image}
                          alt=""
                          style={{
                            maxWidth: '100%', maxHeight: '100%', display: 'block',
                            position: 'relative', zIndex: 1,
                            transform: `translate(${ie.offsetX}px, ${ie.offsetY}px) rotate(${ie.rotate}deg) scaleX(${ie.flipH ? -1 : 1}) scaleY(${ie.flipV ? -1 : 1}) scale(${ie.scale})`,
                            transformOrigin: 'center',
                            pointerEvents: 'none',
                          }}
                        />
                        <button
                          onPointerDown={(e) => e.stopPropagation()}
                          onClick={(e) => { e.stopPropagation(); setPinModal(prev => ({ ...prev, image: null, imgEdit: defaultImgEdit })); }}
                          style={{
                            position: 'absolute', top: 6, right: 6, zIndex: 2,
                            background: 'rgba(0,0,0,0.45)', border: 'none', borderRadius: '50%',
                            width: 22, height: 22, cursor: 'pointer', color: '#fff',
                            display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0,
                          }}
                        ><IconX size={8} /></button>
                        {(ie.offsetX !== 0 || ie.offsetY !== 0) && (
                          <button
                            onPointerDown={(e) => e.stopPropagation()}
                            onClick={(e) => { e.stopPropagation(); setPinModal(prev => ({ ...prev, imgEdit: { ...(prev.imgEdit||defaultImgEdit), offsetX: 0, offsetY: 0 } })); }}
                            style={{
                              position: 'absolute', bottom: 6, right: 6, zIndex: 2,
                              background: 'rgba(0,0,0,0.35)', border: 'none', borderRadius: 6,
                              padding: '2px 7px', cursor: 'pointer', color: '#fff',
                              fontSize: 9, fontFamily: 'HJSS, sans-serif',
                            }}
                          >중앙 초기화</button>
                        )}
                      </div>
                      {/* 편집 툴바 */}
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, alignItems: 'center' }}>
                        <button style={btnStyle(false)} title="90° 왼쪽 회전"
                          onClick={() => setPinModal(prev => ({ ...prev, imgEdit: { ...(prev.imgEdit||defaultImgEdit), rotate: ((prev.imgEdit||defaultImgEdit).rotate - 90 + 360) % 360 } }))}>↺</button>
                        <button style={btnStyle(false)} title="90° 오른쪽 회전"
                          onClick={() => setPinModal(prev => ({ ...prev, imgEdit: { ...(prev.imgEdit||defaultImgEdit), rotate: ((prev.imgEdit||defaultImgEdit).rotate + 90) % 360 } }))}>↻</button>
                        <button style={btnStyle(ie.flipH)} title="좌우 반전"
                          onClick={() => setPinModal(prev => ({ ...prev, imgEdit: { ...(prev.imgEdit||defaultImgEdit), flipH: !(prev.imgEdit||defaultImgEdit).flipH } }))}>↔</button>
                        <button style={btnStyle(ie.flipV)} title="상하 반전"
                          onClick={() => setPinModal(prev => ({ ...prev, imgEdit: { ...(prev.imgEdit||defaultImgEdit), flipV: !(prev.imgEdit||defaultImgEdit).flipV } }))}>↕</button>
                        <input
                          type="range" min="0.4" max="2.0" step="0.05"
                          value={ie.scale}
                          onChange={(e) => setPinModal(prev => ({ ...prev, imgEdit: { ...(prev.imgEdit||defaultImgEdit), scale: parseFloat(e.target.value) } }))}
                          style={{ flex: 1, minWidth: 60, accentColor: 'var(--text-sub)', cursor: 'pointer' }}
                          title={`크기: ${Math.round(ie.scale * 100)}%`}
                        />
                        <span style={{ fontSize: 10, color: 'var(--text-muted)', minWidth: 28 }}>{Math.round(ie.scale * 100)}%</span>
                      </div>
                    </div>
                  );
                })() : (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                    <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', color: 'var(--text-muted)', fontSize: 12 }}>
                      <input type="file" accept="image/*" style={{ display: 'none' }} onChange={handleImageSelect} />
                      <span style={{
                        padding: '7px 14px', borderRadius: 10,
                        background: 'var(--bg)',
                        boxShadow: '3px 3px 6px var(--sh-dark), -3px -3px 6px var(--sh-light)',
                        fontSize: 12, color: 'var(--text-sub)',
                      }}>+ 사진 첨부</span>
                    </label>
                    <span style={{ fontSize: 10, color: 'var(--text-muted)' }}>또는 Ctrl+V 붙여넣기</span>
                  </div>
                )}
              </div>

              <div className="modal-actions">
                <button
                  className="sm-button"
                  onClick={() => setPinModal({ open: false, dateKey: '', memo: '', image: null })}
                >취소</button>
                <button className="sm-button" onClick={savePinMemo}>저장</button>
              </div>
            </div>
          </div>
        )}

        {/* ── 전체 메모 모달 ── */}
        {showMemos && (() => {
          const allMemos = [];
          calendars.forEach(cal => {
            Object.entries(cal.pinnedDates || {}).forEach(([dateKey, pinData]) => {
              const memo = typeof pinData === 'string' ? pinData : (pinData?.memo || '');
              const img  = typeof pinData === 'string' ? null : (pinData?.image || null);
              if (memo || img) allMemos.push({ dateKey, memo, img, calTitle: cal.title, calColor: cal.color });
            });
          });
          allMemos.sort((a, b) => {
            const [ay,am,ad] = a.dateKey.split('-').map(Number);
            const [by,bm,bd] = b.dateKey.split('-').map(Number);
            return new Date(by,bm-1,bd) - new Date(ay,am-1,ad);
          });

          const grouped = {};
          allMemos.forEach(m => {
            const [y, mo] = m.dateKey.split('-');
            const key = `${y}.${String(mo).padStart(2,'0')}`;
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(m);
          });

          return (
            <div className="modal-overlay" onClick={() => setShowMemos(false)}>
              <div className="memos-modal-card" onClick={(e) => e.stopPropagation()}>
                <p className="memos-modal-title">전체 메모</p>
                {allMemos.length === 0 ? (
                  <p className="memos-empty">아직 메모가 없어요.</p>
                ) : (
                  Object.entries(grouped).map(([monthLabel, entries]) => (
                    <div key={monthLabel}>
                      <p className="memo-group-label">{monthLabel}</p>
                      {entries.map((m, i) => (
                        <div key={i} className="memo-entry">
                          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6 }}>
                            <div style={{ width: 6, height: 6, borderRadius: '50%', background: m.calColor, flexShrink: 0 }} />
                            <span className="memo-entry-date">{m.calTitle} · {m.dateKey.replace(/-/g,'.')}</span>
                          </div>
                          {m.memo ? <p className="memo-entry-text">{m.memo}</p> : null}
                          {m.img  ? <img src={m.img} alt="" className="memo-entry-img" /> : null}
                        </div>
                      ))}
                    </div>
                  ))
                )}
              </div>
            </div>
          );
        })()}

      </div>
    );
  }

  /********************************************************
   * 4) 최종 렌더링
   ********************************************************/
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(
    <PasswordGuard>
      <App />
    </PasswordGuard>
  );
  </script>
</body>
</html>
