<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
  <!-- REWRITTEN AS PHONE MOCKUP UI -->
  <style>
    :root {
      --outer-bg:  #D6CFC0;
      --frame-bg:  #1A1714;
      --app-bg:    #EDE8DC;
      --surface:   #F5F0E6;
      --border:    #C8C0B0;
      --border-hi: #9E9080;
      --text-1:    #1A1714;
      --text-2:    #5C5652;
      --text-3:    #A8A098;
      --hover:     #E8E2D4;
      --press:     #DED8CA;
      --accent:    #1A1714;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Noto Sans KR',sans-serif; }
    body { background:var(--outer-bg); min-height:100vh; }

    /* ── page layout ── */
    .page-wrapper {
      min-height: 100vh;
      background: var(--outer-bg);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 20px;
      gap: 40px;
    }

    /* ── phone mockup ── */
    .phone-shell {
      width: 390px;
      min-height: 844px;
      background: var(--frame-bg);
      border-radius: 48px;
      padding: 12px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.08) inset;
      position: relative;
      flex-shrink: 0;
    }
    .phone-screen {
      background: var(--app-bg);
      border-radius: 38px;
      overflow: hidden;
      height: 820px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .phone-notch {
      width: 120px; height: 34px;
      background: var(--frame-bg);
      border-radius: 0 0 20px 20px;
      margin: 0 auto;
      flex-shrink: 0;
      position: relative;
      z-index: 5;
    }
    .phone-content {
      flex: 1;
      overflow-y: auto;
      scrollbar-width: none;
      padding: 0 0 80px 0;
    }
    .phone-content::-webkit-scrollbar { display: none; }
    .phone-tab-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 72px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      border-radius: 0 0 38px 38px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 16px 10px;
      z-index: 10;
    }
    .tab-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; cursor: pointer;
      color: var(--text-3); font-size: 9px; letter-spacing: 0.08em;
      text-transform: uppercase; padding: 6px 16px; border-radius: 14px;
      transition: color 0.12s, background 0.12s;
      font-family: 'DM Mono', monospace;
    }
    .tab-btn:hover { color: var(--text-2); background: var(--hover); }
    .tab-btn.active { color: var(--accent); }
    .tab-btn svg { width: 20px; height: 20px; stroke: currentColor; }
    .tab-active-bar {
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--accent); margin: 0 auto;
    }

    /* ── side panel (wide screen) ── */
    .side-panel {
      width: 300px;
      flex-shrink: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      position: sticky;
      top: 40px;
    }
    @media (max-width: 999px) {
      .side-panel { display: none; }
    }

    /* ── bottom sheet ── */
    .bottom-sheet-overlay {
      position: absolute; inset: 0; z-index: 100;
      background: rgba(0,0,0,0.3);
      display: flex; align-items: flex-end;
      border-radius: 38px;
      overflow: hidden;
    }
    .bottom-sheet {
      background: var(--surface);
      border-radius: 24px 24px 38px 38px;
      width: 100%; max-height: 85%;
      overflow-y: auto;
      padding: 20px 20px 30px;
      scrollbar-width: none;
    }
    .bottom-sheet::-webkit-scrollbar { display: none; }
    .sheet-handle {
      width: 36px; height: 4px; background: var(--border);
      border-radius: 2px; margin: 0 auto 16px;
    }

    /* ── calendar card (inside phone) ── */
    .calendar-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 16px 14px;
      width: 100%;
      flex-shrink: 0;
    }

    .month-navigator {
      display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;
      border-top: 2px solid var(--text-1); padding-top: 10px;
    }
    .month-title {
      font-size: 15px; font-weight: 500; color: var(--text-1);
    }
    .nav-button {
      background: transparent;
      border: 1px solid var(--border);
      padding: 6px 10px;
      cursor: pointer;
      color: var(--text-2);
      font-size: 13px;
      border-radius: 0;
      transition: background 0.08s;
    }
    .nav-button:hover { background: var(--hover); }
    .nav-button:active { background: var(--press); }

    .calendar-subtitle {
      font-size: 10px;
      color: var(--text-3);
      text-align: center;
      margin-bottom: 16px;
      letter-spacing: 0.06em;
    }

/* ── hero header (main view) ── */
.hero-header {
  border-top: 2px solid var(--text-1);
  padding-top: 12px;
  margin-bottom: 14px;
}
.hero-nav {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 10px;
}
.hero-title {
  font-size: 30px; font-weight: 600; color: var(--text-1);
  letter-spacing: -0.02em; line-height: 1.05; cursor: pointer;
}
.hero-year {
  font-size: 16px; font-weight: 400; color: var(--text-3); margin-left: 8px;
}
.hero-subtitle {
  font-size: 11px; color: var(--text-3);
  letter-spacing: 0.05em; margin-top: 6px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.hero-cal-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}

/* ── stats row ── */
.stats-row {
  display: flex;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 12px 0; margin-bottom: 16px;
}
.stat-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; flex: 1;
}
.stat-number {
  font-size: 20px; font-weight: 700; color: var(--text-1);
  line-height: 1; font-family: 'DM Mono', monospace;
}
.stat-label {
  font-size: 9px; color: var(--text-3);
  letter-spacing: 0.08em; text-transform: uppercase;
}
.stat-divider {
  width: 1px; background: var(--border); align-self: stretch;
}

/* ── today memo button ── */
.today-memo-btn {
  width: 100%; padding: 10px 14px; margin-top: 14px;
  background: var(--text-1); color: #fff; border: none;
  font-size: 10px; font-family: 'DM Mono', monospace;
  text-transform: uppercase; letter-spacing: 0.08em;
  cursor: pointer; transition: opacity 0.08s;
}
.today-memo-btn:hover { opacity: 0.82; }
.today-memo-btn:active { opacity: 0.7; }

/* ── empty state ── */
.empty-state {
  display: flex; flex-direction: column; align-items: center;
  padding: 60px 20px; text-align: center;
}
.empty-state-icon {
  font-size: 28px; margin-bottom: 14px; color: var(--border-hi);
}
.empty-state-title {
  font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px;
}
.empty-state-desc {
  font-size: 11px; color: var(--text-3); letter-spacing: 0.03em; line-height: 1.6;
}

    /* ── calendar grid ── */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 34px);
      gap: 4px;
      justify-content: center;
    }
    .day-wrapper { display:flex; flex-direction:column; align-items:center; gap:2px; }
    .calendar-day {
      width:34px; height:34px;
      display:flex; align-items:center; justify-content:center;
      font-size: 12px;
      border: none;
      cursor: pointer;
      border-radius: 50%;
      background: transparent;
      color: var(--text-1);
      transition: background 0.1s;
      touch-action: manipulation;
      user-select: none;
    }
    .calendar-day.day-header {
      font-size: 10px; color: var(--text-3); cursor:default; font-weight:500; letter-spacing:0.04em;
    }
    .calendar-day:not(.day-header):not(.day-empty):hover { background: var(--hover); }
    .calendar-day:disabled { cursor: default; }
    .pin-dot { width:3px; height:3px; border-radius:50%; opacity:0.8; }

    /* ── sidebar calendar list ── */
    .calendar-list { margin-bottom:16px; }
    .calendar-item {
      padding: 8px 10px;
      border-radius: 0;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0;
      border-bottom: 1px solid var(--border);
      color: var(--text-2);
      font-size: 13px;
      gap: 6px;
      transition: none;
    }
    .calendar-item:hover { background: var(--hover); }
    .calendar-item.selected { background: var(--press); color: var(--text-1); font-weight:500; border-bottom-color: var(--border-hi); border-left: 3px solid var(--text-1); padding-left: 7px; }
    .calendar-item.drag-over { border-top: 2px solid var(--border-hi); }
    .cal-item-left { display:flex; align-items:center; gap:7px; flex:1; min-width:0; }
    .cal-color-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
    .cal-title-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cal-item-actions {
      display:flex; gap:2px; flex-shrink:0;
      opacity:0; pointer-events:none; transition:opacity 0.08s;
    }
    .calendar-item:hover .cal-item-actions { opacity:1; pointer-events:auto; }

    .icon-btn {
      background:none; border:none; cursor:pointer;
      color:var(--text-3); padding:3px;
      border-radius:2px; transition:color 0.08s, background 0.08s;
      display:flex; align-items:center; justify-content:center;
    }
    .icon-btn:hover { color:var(--text-2); background:var(--hover); }
    .icon-btn.del:hover { color:#C0796A; background:#FEF2F0; }

    /* ── inline edit form ── */
    .cal-edit-form {
      display:flex; flex-direction:column; gap:6px; width:100%;
      padding:8px 10px; border-radius:0; margin-bottom:4px;
      background:var(--surface); border:1px solid var(--border);
    }
    .cal-edit-row { display:flex; gap:5px; align-items:center; }

    /* ── new calendar form ── */
    .new-calendar-form { margin-top:16px; }
    .input-text {
      width:100%; padding:8px 12px;
      border: 1px solid var(--border);
      border-radius: 0;
      margin-bottom:8px;
      background: var(--surface);
      color: var(--text-1);
      outline:none; font-size:13px;
      transition: border-color 0.08s;
    }
    .input-text:focus { border-color: var(--border-hi); }
    .input-text::placeholder { color:var(--text-3); }

    .input-text-sm {
      flex:1; padding:5px 9px;
      border:1px solid var(--border); border-radius:0;
      background:var(--surface); color:var(--text-1);
      outline:none; font-size:12px; min-width:0;
      transition: border-color 0.08s;
    }
    .input-text-sm:focus { border-color:var(--border-hi); }

    .color-picker-container { display:flex; gap:8px; }
    .color-picker {
      width:36px; height:36px; border:1px solid var(--border);
      border-radius:0; cursor:pointer; background:var(--surface); padding:2px;
    }
    .color-picker-sm {
      width:28px; height:28px; border:1px solid var(--border);
      border-radius:0; cursor:pointer; background:var(--surface); padding:1px; flex-shrink:0;
    }

    .add-button {
      flex-grow:1; padding:8px;
      background:var(--text-1); border:none; border-radius:0;
      cursor:pointer; color:#fff; font-size:11px;
      font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:0.06em;
      transition:opacity 0.08s;
    }
    .add-button:hover { opacity:0.82; }
    .add-button:active { opacity:0.7; }

    .sm-button {
      padding:5px 10px;
      background:transparent; border:1px solid var(--border); border-radius:0;
      cursor:pointer; color:var(--text-2); font-size:11px;
      transition:background 0.08s; white-space:nowrap;
    }
    .sm-button:hover { background:var(--hover); }
    .sm-button:active { background:var(--press); }

    /* ── focus widget ── */
    .focus-widget {
      width:100%; max-width:360px; margin-top:14px;
      background:var(--surface); border:1px solid var(--border); border-radius:4px;
      padding:16px 18px;
    }
    .focus-widget-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .focus-widget-label { font-size:9px; color:var(--text-3); letter-spacing:0.12em; text-transform:uppercase; }
    .focus-widget-text { font-size:12px; color:var(--text-2); line-height:1.7; }
    .focus-refresh-btn {
      background:none; border:none; cursor:pointer; color:var(--text-3);
      font-size:14px; padding:2px 4px; border-radius:0; transition:color 0.08s;
    }
    .focus-refresh-btn:hover { color:var(--text-2); }

    /* ── export button ── */
    .export-btn {
      display:inline-flex; align-items:center; gap:5px;
      margin-top:12px; padding:8px 18px;
      background:transparent; border:1px solid var(--border); border-radius:0;
      cursor:pointer; color:var(--text-2); font-size:11px; letter-spacing:0.06em;
      font-family:'DM Mono',monospace; text-transform:uppercase;
      transition:background 0.08s, color 0.08s, border-color 0.08s;
    }
    .export-btn:hover { background:var(--hover); border-color:var(--border-hi); }
    .export-btn.done { color:#4A8E5C; border-color:#A8C9A8; }

    /* ── postit (flat card) ── */
    .postit-col { display:flex; flex-direction:column; gap:12px; padding-top:10px; flex-shrink:0; }
    .postit {
      width:160px; background:var(--surface);
      border:1px solid var(--border); border-radius:0;
      padding:14px 14px 14px 16px;
      position:relative; overflow:hidden;
    }
    .postit-tack { /* color accent left border via inline style */ }
    .postit-day-bg {
      position:absolute; bottom:-4px; right:8px;
      font-size:56px; font-weight:700; line-height:1;
      opacity:0.03; color:var(--text-1);
      user-select:none; pointer-events:none; letter-spacing:-0.02em;
    }
    .postit-date { font-size:9px; color:var(--text-3); letter-spacing:0.1em; margin-bottom:6px; text-transform:uppercase; }
    .postit-memo { font-size:12px; color:var(--text-1); line-height:1.65; white-space:pre-wrap; word-break:break-word; position:relative; z-index:1; }
    .postit-actions { display:none; position:absolute; top:6px; right:6px; gap:3px; z-index:3; }
    .postit:hover .postit-actions { display:flex; }
    .postit-btn {
      width:20px; height:20px; border-radius:0;
      background:var(--surface); border:1px solid var(--border);
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      color:var(--text-3); transition:color 0.08s; padding:0;
    }
    .postit-btn:hover { color:var(--text-2); background:var(--hover); }
    .postit-btn.del:hover { color:#C0796A; background:#FEF2F0; }

    /* ── modal ── */
    .modal-overlay {
      position:fixed; inset:0;
      background:rgba(0,0,0,0.18);
      display:flex; align-items:center; justify-content:center; z-index:200;
    }
    .modal-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:4px; padding:24px 22px; width:300px;
    }
    .modal-date-label { font-size:10px; color:var(--text-3); letter-spacing:0.1em; margin-bottom:3px; }
    .modal-cal-label { font-size:12px; color:var(--text-2); margin-bottom:12px; }
    .modal-textarea {
      width:100%; min-height:100px; border:1px solid var(--border); border-radius:0;
      padding:10px 12px; background:var(--surface); color:var(--text-1);
      outline:none; font-size:12px; resize:none; line-height:1.65; margin-bottom:12px;
      transition:border-color 0.08s;
    }
    .modal-textarea:focus { border-color:var(--border-hi); }
    .modal-textarea::placeholder { color:var(--text-3); }
    .modal-actions { display:flex; gap:6px; justify-content:flex-end; }
    .modal-hint { font-size:10px; color:var(--text-3); margin-bottom:10px; }

    /* ── password screen ── */
    .password-container {
      background:var(--surface); border:1px solid var(--border); border-radius:4px;
      padding:36px 28px; max-width:320px; margin:80px auto; text-align:center;
    }
    .password-title { font-size:13px; color:var(--text-2); margin-bottom:18px; letter-spacing:0.04em; }

    /* ── settings panel ── */
    .settings-panel { margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }
    .settings-toggle {
      display:flex; align-items:center; justify-content:space-between;
      cursor:pointer; font-size:11px; color:var(--text-2); letter-spacing:0.08em;
      padding:3px 0; background:none; border:none; width:100%; text-transform:uppercase;
    }
    .settings-toggle:hover { color:var(--text-1); }
    .settings-body { margin-top:14px; }
    .settings-section-label {
      font-size:9px; color:var(--text-3); letter-spacing:0.12em;
      text-transform:uppercase; margin-bottom:6px;
    }

    .theme-dots { display:flex; gap:6px; margin-bottom:14px; }
    .theme-dot {
      width:18px; height:18px; border-radius:50%;
      border:2px solid transparent; cursor:pointer; transition:border-color 0.08s;
    }
    .theme-dot.active { border-color:var(--border-hi); }

    /* ── palette presets ── */
    .palette-dots { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
    .palette-dot-btn {
      display:flex; flex-direction:column; align-items:center; gap:2px;
      background:none; border:1px solid transparent; cursor:pointer;
      padding:4px; border-radius:0; transition:border-color 0.08s;
    }
    .palette-dot-btn:hover { border-color:var(--border); }
    .palette-dot-btn.active { border-color:var(--border-hi); background:var(--hover); }
    .palette-dot-circle { width:18px; height:18px; border-radius:50%; }
    .palette-dot-label { font-size:8px; color:var(--text-3); letter-spacing:0.04em; }

    /* ── focus msg items ── */
    .focus-msg-item { display:flex; align-items:flex-start; gap:5px; margin-bottom:5px; font-size:11px; color:var(--text-2); line-height:1.5; }
    .focus-msg-text { flex:1; min-width:0; word-break:break-word; }
    .focus-add-row { display:flex; gap:5px; margin-top:6px; align-items:flex-end; }
    .focus-add-textarea {
      flex:1; min-height:40px; border:1px solid var(--border); border-radius:0;
      padding:6px 8px; background:var(--surface); color:var(--text-1);
      outline:none; font-size:11px; resize:none; line-height:1.5;
      transition:border-color 0.08s;
    }
    .focus-add-textarea:focus { border-color:var(--border-hi); }

    /* ── checklist ── */
    .checklist-card {
      background:var(--surface); border:1px solid var(--border); border-radius:4px;
      padding:14px 16px; margin-top:12px; width:100%;
    }
    .checklist-title { font-size:9px; color:var(--text-3); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:8px; }
    .checklist-item { display:flex; align-items:center; gap:7px; padding:4px 0; border-bottom:1px solid var(--border); }
    .checklist-item:last-child { border-bottom:none; }
    .checklist-check {
      width:15px; height:15px; border-radius:2px;
      border:1px solid var(--border-hi); background:var(--surface);
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      flex-shrink:0; padding:0; transition:background 0.08s, border-color 0.08s;
    }
    .checklist-check.done { background:var(--text-2); border-color:var(--text-2); }
    .checklist-text { flex:1; font-size:12px; color:var(--text-2); line-height:1.4; transition:opacity 0.08s; word-break:break-all; }
    .checklist-text.done { opacity:0.35; text-decoration:line-through; }
    .checklist-del {
      background:transparent; border:none; color:var(--text-3); cursor:pointer;
      padding:0 2px; font-size:13px; line-height:1; opacity:0; transition:opacity 0.08s; flex-shrink:0;
    }
    .checklist-item:hover .checklist-del { opacity:1; }
    .checklist-star {
      background:transparent; border:none; cursor:pointer; color:var(--text-3);
      font-size:10px; padding:0 1px; line-height:1; opacity:0; transition:opacity 0.08s, color 0.08s; flex-shrink:0;
    }
    .checklist-item:hover .checklist-star { opacity:1; }
    .checklist-star.starred { opacity:1; color:var(--text-2); }
    .checklist-add-row { display:flex; gap:5px; margin-top:8px; align-items:center; }
    .checklist-input {

  const hslToHex = (h,s,l) => {
    h=((h%360)+360)%360; s/=100; l/=100;
    const a=s*Math.min(l,1-l);
    const f=n=>{const k=(n+h/30)%12; return Math.round(255*(l-a*Math.max(Math.min(k-3,9-k,1),-1))).toString(16).padStart(2,'0');};
    return '#'+f(0)+f(8)+f(4);
  };

  const generateHarmoniousColors = (baseHue, count) => {
    if(count===0) return [];
    const sVals=[28,22,34,25,30,20], lVals=[74,68,80,72,77,66];
    const hueRange=Math.min(count-1,5)*8;
    return Array.from({length:count},(_,i)=>{
      const hue=count===1?baseHue:((baseHue-hueRange/2+i*hueRange/(count-1))+360)%360;
      return hslToHex(hue, sVals[i%sVals.length], lVals[i%lVals.length]);

        let blob;
        try {

        let status='copied';
        try {

          if (exportBlobUrl) URL.revokeObjectURL(exportBlobUrl);

    const applyImageTransforms = (dataUrl, { rotate, flipH, flipV, scale, offsetX=0, offsetY=0 }) =>
      new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          if (offsetX!==0 || offsetY!==0) {
            const VW=300, VH=160, fitScale=Math.min(VW/img.width,VH/img.height)||1, totalScale=fitScale*scale;
            const canvas=document.createElement('canvas'); canvas.width=VW; canvas.height=VH;
            const ctx=canvas.getContext('2d');
            ctx.translate(VW/2+offsetX, VH/2+offsetY);
            ctx.rotate((rotate*Math.PI)/180);
            ctx.scale(flipH?-totalScale:totalScale, flipV?-totalScale:totalScale);
            ctx.drawImage(img,-img.width/2,-img.height/2);
            resolve(canvas.toDataURL('image/jpeg',0.88));
          } else {
            const rad=(rotate*Math.PI)/180, sin=Math.abs(Math.sin(rad)), cos=Math.abs(Math.cos(rad));
            const sw=img.width*scale, sh=img.height*scale;
            const cw=Math.round(sw*cos+sh*sin), ch=Math.round(sw*sin+sh*cos);
            const canvas=document.createElement('canvas'); canvas.width=cw; canvas.height=ch;
            const ctx=canvas.getContext('2d');
            ctx.translate(cw/2,ch/2); ctx.rotate(rad);
            ctx.scale(flipH?-scale:scale, flipV?-scale:scale);
            ctx.drawImage(img,-img.width/2,-img.height/2);
            resolve(canvas.toDataURL('image/jpeg',0.88));
          }
        };
        img.src=dataUrl;
      });

    const openPinModal = (day) => {
      if (!selectedCalendar) return;
      const dateKey = `${currentDate.getFullYear()}-${currentDate.getMonth()+1}-${day}`;
      const existing = (currentCalendar.pinnedDates||{})[dateKey]||{};
      const memo = typeof existing==='string' ? existing : (existing.memo||'');
      const image = typeof existing==='string' ? null : (existing.image||null);
      setPinModal({ open:true, dateKey, memo, image, imgEdit:defaultImgEdit });
    };

    const savePinMemo = async () => {
      if (!selectedCalendar) return;
      let img = pinModal.image;
      const ie = pinModal.imgEdit||defaultImgEdit;
      if (img && (ie.rotate!==0||ie.flipH||ie.flipV||ie.scale!==1.0||ie.offsetX!==0||ie.offsetY!==0))
        img = await applyImageTransforms(img, ie);
      const newPinnedDates = { ...(currentCalendar.pinnedDates||{}) };
      if (pinModal.memo.trim()||img) newPinnedDates[pinModal.dateKey] = { memo:pinModal.memo.trim(), image:img };
      else delete newPinnedDates[pinModal.dateKey];
      try {
        await db.collection('calendars').doc(selectedCalendar).update({ pinnedDates:newPinnedDates });
        setPinModal({ open:false, dateKey:'', memo:'', image:null, imgEdit:defaultImgEdit });
      } catch(err) { console.error(err); }
    };

    const removePin = async (dateKey) => {
      if (!selectedCalendar) return;
      const np = { ...(currentCalendar.pinnedDates||{}) }; delete np[dateKey];
      try { await db.collection('calendars').doc(selectedCalendar).update({ pinnedDates:np }); } catch(err) { console.error(err); }
    };

    const handleImageSelect = (e) => {
      const file = e.target.files?.[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => setPinModal(prev => ({ ...prev, image:ev.target.result, imgEdit:defaultImgEdit }));
      reader.readAsDataURL(file);
    };

    const handlePressStart = (day) => {
      didLongPress.current=false; clearTimeout(pressTimer.current);
      pressTimer.current=setTimeout(()=>{ didLongPress.current=true; openPinModal(day); },600);
    };
    const handlePressEnd = () => clearTimeout(pressTimer.current);
    const handleDayClick = (day) => { if(didLongPress.current) return; toggleDate(day); };
    const navigateMonth = (dir) => setCurrentDate(prev => { const d=new Date(prev); d.setMonth(d.getMonth()+(dir==='prev'?-1:1)); return d; });
    // toggleSidebar removed; navigation handled via activeTab

    const applyThemePreset = (theme) => applyFullTheme(theme);
    const saveSubtitle = () => saveSettings({ ...settings, subtitle:editSubtitle });
    const addFocusMessage = () => {
      if (!newFocusMsg.trim()) return;
      const msgs=[...(settings.focusMessages||[]),newFocusMsg.trim()];
      saveSettings({ ...settings, focusMessages:msgs });
      setFocusMessage(newFocusMsg.trim()); setNewFocusMsg('');
    };
    const deleteFocusMessage = (idx) => {
      const msgs=settings.focusMessages.filter((_,i)=>i!==idx);
      saveSettings({ ...settings, focusMessages:msgs });
      if(msgs.length>0) setFocusMessage(msgs[Math.floor(Math.random()*msgs.length)]); else setFocusMessage('');
    };
    const saveFocusEdit = (idx) => {
      const t=editingFocusText.trim(); if(!t) return;
      const msgs=settings.focusMessages.map((m,i)=>i===idx?t:m);
      saveSettings({ ...settings, focusMessages:msgs });
      setEditingFocusIdx(null); setEditingFocusText('');
    };
    const refreshFocusMessage = () => {
      const msgs=settings.focusMessages; if(!msgs||msgs.length===0) return;
      setFocusMessage(msgs[Math.floor(Math.random()*msgs.length)]);
    };

    const applyBulkPalette = async (preset) => {
      if(calendars.length===0) return;
      setLastCalColors(calendars.map(c=>({id:c.id,color:c.color})));
      const newColors=generateHarmoniousColors(preset.baseHue,calendars.length);
      try {
        const batch=db.batch();
        calendars.forEach((c,i)=>batch.update(db.collection('calendars').doc(c.id),{color:newColors[i]}));
        await batch.commit(); setSelectedPalette(preset.name);
      } catch(err) { console.error(err); }
    };
    const undoBulkPalette = async () => {
      if(!lastCalColors) return;
      try {
        const batch=db.batch();
        lastCalColors.forEach(({id,color})=>batch.update(db.collection('calendars').doc(id),{color}));
        await batch.commit(); setLastCalColors(null); setSelectedPalette(null);
      } catch(err) { console.error(err); }
    };

    const handleDragHandlePointerDown = (e,id) => {
      e.currentTarget.setPointerCapture(e.pointerId);
      draggedIdRef.current=id; document.body.style.cursor='grabbing';
    };
    const handleDragHandlePointerMove = (e) => {
      if(!draggedIdRef.current) return;
      const el=document.elementFromPoint(e.clientX,e.clientY);
      const item=el?.closest('[data-cal-id]');
      const targetId=item?.dataset?.calId;
      if(targetId&&targetId!==draggedIdRef.current) setDragOverId(targetId);
      else if(!targetId) setDragOverId(null);
    };
    const handleDragHandlePointerUp = () => {
      document.body.style.cursor='';
      const fromId=draggedIdRef.current;
      if(fromId&&dragOverId&&fromId!==dragOverId){
        const fromIdx=calendars.findIndex(c=>c.id===fromId);
        const toIdx=calendars.findIndex(c=>c.id===dragOverId);
        if(fromIdx>=0&&toIdx>=0){
          const nc=[...calendars]; const [moved]=nc.splice(fromIdx,1); nc.splice(toIdx,0,moved);
          setCalendars(nc); localStorage.setItem('nagi-cal-order',JSON.stringify(nc.map(c=>c.id)));
        }
      }
      setDragOverId(null); draggedIdRef.current=null;
    };

    const currentCalendar = calendars.find(c=>c.id===selectedCalendar) || { completedDates:[], color:'#9CA3AF', pinnedDates:{}, title:'' };
    const daysInMonth = new Date(currentDate.getFullYear(), currentDate.getMonth()+1, 0).getDate();
    const completedThisMonth = (selectedCalendar && selectedCalendar !== 'all')
      ? currentCalendar.completedDates.filter(d => {
          const parts = d.split('-');
          return parseInt(parts[0]) === currentDate.getFullYear() && parseInt(parts[1]) === currentDate.getMonth()+1;
        }).length
      : 0;
    const completionRate = daysInMonth > 0 ? Math.round((completedThisMonth / daysInMonth) * 100) : 0;
    const weekStart = settings.weekStart||'sun';
    const DOW_LABELS = weekStart==='mon' ? ['MON','TUE','WED','THU','FRI','SAT','SUN'] : ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const rawFirstDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay();
    const firstDay = weekStart==='mon' ? (rawFirstDay+6)%7 : rawFirstDay;
    const todayObj = new Date();
    const todayDay = (todayObj.getFullYear()===currentDate.getFullYear()&&todayObj.getMonth()===currentDate.getMonth()) ? todayObj.getDate() : -1;
    const pinnedDates = currentCalendar.pinnedDates||{};
    const monthPrefix = `${currentDate.getFullYear()}-${currentDate.getMonth()+1}-`;
    const currentMonthPins = Object.entries(pinnedDates)
      .filter(([k])=>k.startsWith(monthPrefix))
      .sort(([a],[b])=>parseInt(a.split('-')[2])-parseInt(b.split('-')[2]));
    const formatDateKey = (dk) => { const [y,m,d]=dk.split('-'); return `${y}. ${String(m).padStart(2,'0')}. ${String(d).padStart(2,'0')}`; };

    const CloverDot = ({ colors }) => {
      if(!colors||colors.length===0) return null;
      const size=14, pr=3.6, off=2.5, cx=7, cy=7;
      const petals=[{dx:-off,dy:-off},{dx:off,dy:-off},{dx:off,dy:off},{dx:-off,dy:off}];
      return (
        <svg width={size} height={size} style={{display:'block'}}>
          {colors.slice(0,4).map((color,i)=>(
            <circle key={i} cx={cx+petals[i].dx} cy={cy+petals[i].dy} r={pr} fill={color} opacity="0.92" />
          ))}
        </svg>
      );
    };

    /* ── helper components ── */
    const ColorRow = ({ label, varKey, value }) => {
      const [hex, setHex] = React.useState(value||'#000000');
      React.useEffect(()=>{ setHex(value||'#000000'); }, [value]);
      const apply = (v) => {
        setHex(v);
        const newS = { ...settings, [varKey]: v };
        saveSettings(newS);
      };
      const handleText = (e) => {
        const v = e.target.value;
        setHex(v);
        if (/^#[0-9A-Fa-f]{6}$/.test(v)) apply(v);
      };
      return (
        <div className="color-row">
          <div className="color-swatch" style={{background: hex}}>
            <input type="color" value={hex} onChange={e=>apply(e.target.value)} />
          </div>
          <span className="color-row-label">{label}</span>
          <input className="color-row-input" value={hex} onChange={handleText} maxLength={7} />
        </div>
      );
    };

    const SettingsContent = () => (
      <div>
        <p style={{fontSize:9,color:'var(--text-3)',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:8}}>Quick Themes</p>
        <div className="theme-presets">
          {FULL_THEMES.map(t=>(
            <button key={t.name} className={`theme-preset-btn${settings.outerBg===t.outerBg&&settings.frameBg===t.frameBg?' active':''}`}
              onClick={()=>applyFullTheme(t)}>
              <div className="theme-preset-dots">
                <div className="theme-preset-dot" style={{background:t.outerBg}} />
                <div className="theme-preset-dot" style={{background:t.frameBg}} />
                <div className="theme-preset-dot" style={{background:t.appBg}} />
              </div>
              <span className="theme-preset-name">{t.name}</span>
            </button>
          ))}
        </div>

        <p style={{fontSize:9,color:'var(--text-3)',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:8}}>Colors</p>
        <ColorRow label="Page Background" varKey="outerBg" value={settings.outerBg} />
        <ColorRow label="Phone Frame" varKey="frameBg" value={settings.frameBg} />
        <ColorRow label="Screen Background" varKey="appBg" value={settings.appBg} />
        <ColorRow label="Surface / Cards" varKey="surfaceBg" value={settings.surfaceBg} />
        <ColorRow label="Border" varKey="borderColor" value={settings.borderColor} />
        <ColorRow label="Text Primary" varKey="text1" value={settings.text1} />
        <ColorRow label="Text Secondary" varKey="text2" value={settings.text2} />
        <ColorRow label="Text Muted" varKey="text3" value={settings.text3} />
        <ColorRow label="Accent" varKey="accent" value={settings.accent} />

        <p style={{fontSize:9,color:'var(--text-3)',letterSpacing:'0.12em',textTransform:'uppercase',margin:'14px 0 8px'}}>Calendar Palette</p>
        <div className="palette-dots">
          {PALETTE_PRESETS.map(preset=>(
            <button key={preset.name} className={`palette-dot-btn${selectedPalette===preset.name?' active':''}`}
              title={preset.label} onClick={()=>applyBulkPalette(preset)}>
              <div className="palette-dot-circle" style={{background:preset.swatch}} />
              <span className="palette-dot-label">{preset.label}</span>
            </button>
          ))}
        </div>
        {lastCalColors && (
          <button className="sm-button" style={{marginBottom:14,fontSize:10}} onClick={undoBulkPalette}>↩ 되돌리기</button>
        )}

        <p style={{fontSize:9,color:'var(--text-3)',letterSpacing:'0.12em',textTransform:'uppercase',margin:'14px 0 8px'}}>Subtitle</p>
        <div className="cal-edit-row" style={{marginBottom:14}}>
          <input type="text" className="input-text-sm" value={editSubtitle}
            onChange={e=>setEditSubtitle(e.target.value)} onKeyDown={e=>e.key==='Enter'&&saveSubtitle()} />
          <button className="sm-button" onClick={saveSubtitle}>저장</button>
        </div>

        <p style={{fontSize:9,color:'var(--text-3)',letterSpacing:'0.12em',textTransform:'uppercase',margin:'14px 0 8px'}}>Week Start</p>
        <div style={{display:'flex',gap:6,marginBottom:14}}>
          {[{val:'sun',label:'SUN'},{val:'mon',label:'MON'}].map(opt=>{
            const isActive=(settings.weekStart||'sun')===opt.val;
            return (
              <button key={opt.val} style={{
                flex:1,padding:'6px 0',border:`1px solid ${isActive?'var(--border-hi)':'var(--border)'}`,
                borderRadius:0,cursor:'pointer',
                background:isActive?'var(--press)':'transparent',
                color:isActive?'var(--text-1)':'var(--text-3)',fontSize:11,letterSpacing:'0.08em',
              }} onClick={()=>saveSettings({...settings,weekStart:opt.val})}>
                {opt.label}
              </button>
            );
          })}
        </div>

        <p style={{fontSize:9,color:'var(--text-3)',letterSpacing:'0.12em',textTransform:'uppercase',margin:'14px 0 8px'}}>Focus Messages</p>
        <div>
          {(settings.focusMessages||[]).map((msg,idx)=>(
            <div key={idx} className="focus-msg-item">
              {editingFocusIdx===idx ? (
                <>
                  <textarea className="focus-add-textarea" rows={2} value={editingFocusText}
                    onChange={e=>setEditingFocusText(e.target.value)} autoFocus style={{flex:1}} />
                  <div style={{display:'flex',flexDirection:'column',gap:3,flexShrink:0}}>
                    <button className="sm-button" style={{fontSize:10,padding:'2px 6px'}} onClick={()=>saveFocusEdit(idx)}>저장</button>
                    <button className="sm-button" style={{fontSize:10,padding:'2px 6px'}} onClick={()=>{setEditingFocusIdx(null);setEditingFocusText('');}}>취소</button>
                  </div>
                </>
              ) : (
                <>
                  <span className="focus-msg-text">{msg}</span>
                  <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-3)',padding:2,flexShrink:0,display:'flex',alignItems:'center'}}
                    onClick={()=>{setEditingFocusIdx(idx);setEditingFocusText(msg);}}><IconPen size={8}/></button>
                  <button style={{background:'none',border:'none',cursor:'pointer',color:'var(--text-3)',padding:2,flexShrink:0,display:'flex',alignItems:'center'}}
                    onClick={()=>deleteFocusMessage(idx)}><IconX size={8}/></button>
                </>
              )}
            </div>
          ))}
          <div className="focus-add-row">
            <textarea className="focus-add-textarea" rows={2} placeholder="새 메시지 입력..." value={newFocusMsg} onChange={e=>setNewFocusMsg(e.target.value)} />
            <button className="sm-button" onClick={addFocusMessage}>+</button>
          </div>
        </div>

        <p style={{fontSize:9,color:'var(--text-3)',letterSpacing:'0.12em',textTransform:'uppercase',margin:'14px 0 8px'}}>All Memos</p>
        <button className="sm-button" style={{width:'100%'}} onClick={()=>setShowMemos(true)}>전체 메모 보기</button>
      </div>
    );

    /* ── TAB: TODAY ── */
    const TodayTab = () => (
      <div style={{padding:'0 14px'}}>
        {calendars.length===0 ? (
          <div className="empty-state">
            <div className="empty-state-icon">◯</div>
            <p className="empty-state-title">아직 캘린더가 없어요</p>
            <p className="empty-state-desc">캘린더 탭에서 첫 캘린더를 만들어보세요</p>
          </div>
        ) : (
          <>
            {/* Hero header */}
            <div style={{paddingTop:16,paddingBottom:12,borderBottom:'1px solid var(--border)',marginBottom:14}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
                <button className="nav-button" onClick={()=>navigateMonth('prev')}>←</button>
                <div style={{textAlign:'center'}}>
                  <div style={{fontSize:28,fontWeight:700,color:'var(--text-1)',letterSpacing:'-0.02em',lineHeight:1.1,cursor:'pointer'}}
                    onClick={()=>setCurrentDate(new Date())}>
                    {currentDate.toLocaleString('en-US',{month:'long'})}
                    <span style={{fontSize:14,fontWeight:400,color:'var(--text-3)',marginLeft:6}}>{currentDate.getFullYear()}</span>
                  </div>
                  <div style={{fontSize:10,color:'var(--text-3)',letterSpacing:'0.05em',marginTop:4,display:'flex',alignItems:'center',justifyContent:'center',gap:5,flexWrap:'wrap'}}>
                    {currentCalendar.title && (
                      <>
                        <div style={{width:6,height:6,borderRadius:'50%',background:currentCalendar.color,flexShrink:0}} />
                        <span>{currentCalendar.title}</span>
                        <span>·</span>
                      </>
                    )}
                    <span>{settings.subtitle}</span>
                  </div>
                </div>
                <button className="nav-button" onClick={()=>navigateMonth('next')}>→</button>
              </div>
            </div>

            {/* Stats row */}
            <div className="stats-row">
              <div className="stat-item">
                <span className="stat-number">{daysInMonth}</span>
                <span className="stat-label">days</span>
              </div>
              <div className="stat-divider" />
              <div className="stat-item">
                <span className="stat-number">{completedThisMonth}</span>
                <span className="stat-label">done</span>
              </div>
              <div className="stat-divider" />
              <div className="stat-item">
                <span className="stat-number">{completionRate}%</span>
                <span className="stat-label">rate</span>
              </div>
            </div>

            {/* Calendar grid */}
            <div id="calendar-export-area" style={{background:'var(--app-bg)',padding:'10px 0'}}>
              <div className="calendar-grid" style={{marginBottom:4}}>
                {DOW_LABELS.map(d=><div key={d} className="calendar-day day-header">{d}</div>)}
              </div>
              <div className="calendar-grid">
                {Array(firstDay).fill(null).map((_,i)=><div key={`e-${i}`} className="calendar-day day-empty"/>)}
                {Array(daysInMonth).fill(null).map((_,i)=>{
                  const day=i+1;
                  const dateKey=`${currentDate.getFullYear()}-${currentDate.getMonth()+1}-${day}`;
                  const isCompleted=currentCalendar.completedDates.includes(dateKey);
                  const isPinned=!!(pinnedDates[dateKey]);
                  const isToday=day===todayDay;
                  return (
                    <div key={day} className="day-wrapper">
                      <button className="calendar-day"
                        onMouseDown={()=>handlePressStart(day)} onMouseUp={handlePressEnd} onMouseLeave={handlePressEnd}
                        onTouchStart={()=>handlePressStart(day)} onTouchEnd={handlePressEnd}
                        onClick={()=>handleDayClick(day)}
                        style={{
                          backgroundColor:isCompleted?currentCalendar.color:'transparent',
                          color:isCompleted?getContrastColor(currentCalendar.color):'var(--text-1)',
                          fontWeight:isToday?700:'normal',
                          border:!isCompleted&&isToday?'1px solid var(--border-hi)':'',
                        }}>
                        {day}
                      </button>
                      {isPinned && <div className="pin-dot" style={{backgroundColor:currentCalendar.color}} />}
                    </div>
                  );
                })}
              </div>
            </div>

            {todayDay > 0 && (
              <button className="today-memo-btn" onClick={()=>openPinModal(todayObj.getDate())}>
                + 오늘 ({todayDay}일) 메모 추가
              </button>
            )}

            {/* Focus widget */}
            {focusMessage && (
              <div className="focus-widget">
                <div className="focus-widget-header">
                  <p className="focus-widget-label">focus</p>
                  <button className="focus-refresh-btn" onClick={refreshFocusMessage} title="새 메시지">↺</button>
                </div>
                <p className="focus-widget-text">{focusMessage}</p>
              </div>
            )}

            {/* Checklist */}
            <div className="checklist-card">
              <p className="checklist-title">checklist</p>
              {checklist.length>0 && checklist.map(item=>(
                <div key={item.id} className="checklist-item"
                  style={item.starred?{backgroundColor:'var(--hover)',borderRadius:0,margin:'2px -4px',padding:'4px 4px'}:{}}>
                  <button className={`checklist-star${item.starred?' starred':''}`}
                    style={item.starred?{color:currentCalendar.color,opacity:1}:{}}
                    onClick={()=>starCheckItem(item.id)}>{item.starred?'★':'☆'}</button>
                  <button className={`checklist-check${item.done?' done':''}`}
                    style={item.done?{background:currentCalendar.color,borderColor:currentCalendar.color}:{}}
                    onClick={()=>toggleCheckItem(item.id)} />
                  {editingCheckId===item.id ? (
                    <>
                      <input className="checklist-input" value={editingCheckText}
                        onChange={e=>setEditingCheckText(e.target.value)}
                        onKeyDown={e=>{if(e.key==='Enter')saveCheckEdit(item.id);if(e.key==='Escape')cancelCheckEdit();}}
                        autoFocus style={{flex:1}} />
                      <button className="checklist-del" onClick={()=>saveCheckEdit(item.id)} style={{opacity:1,fontSize:11}}>✓</button>
                      <button className="checklist-del" onClick={cancelCheckEdit} style={{opacity:1}}>×</button>
                    </>
                  ) : (
                    <>
                      <span className={`checklist-text${item.done?' done':''}`}>{item.text}</span>
                      <button className="checklist-del" onClick={()=>editCheckItem(item.id,item.text)} title="편집" style={{fontSize:10}}>✎</button>
                      <button className="checklist-del" onClick={()=>deleteCheckItem(item.id)}>×</button>
                    </>
                  )}
                </div>
              ))}
              <div className="checklist-add-row">
                <input className="checklist-input" value={newCheckItem}
                  onChange={e=>setNewCheckItem(e.target.value)}
                  onKeyDown={e=>e.key==='Enter'&&addCheckItem()} placeholder="새 항목 추가" />
                <button className="checklist-add-btn" onClick={addCheckItem}>+</button>
              </div>
            </div>

            {/* Post-it memos */}
            {currentMonthPins.length>0 && (
              <div style={{marginTop:14}}>
                <p style={{fontSize:9,color:'var(--text-3)',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:8}}>Memos</p>
                <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:8,marginLeft:-14,marginRight:-14,paddingLeft:14,paddingRight:14}}>
                  {currentMonthPins.map(([dateKey,pinData])=>{
                    const pin=pinData;
                    const memo=typeof pin==='string'?pin:(pin?.memo||'');
                    const img=typeof pin==='string'?null:(pin?.image||null);
                    const dayNum=dateKey.split('-')[2];
                    return (
                      <div key={dateKey} className="postit"
                        style={{borderTop:`2px solid ${currentCalendar.color}`,flexShrink:0,minWidth:140}}>
                        <div className="postit-day-bg">{dayNum}</div>
                        <p className="postit-date">{formatDateKey(dateKey)}</p>
                        <p className="postit-memo">{memo}</p>
                        {img ? <img src={img} alt="" style={{width:'100%',borderRadius:0,marginTop:6,display:'block'}} /> : null}
                        <div className="postit-actions">
                          <button className="postit-btn" onClick={()=>{
                            const ex=currentCalendar.pinnedDates?.[dateKey]||{};
                            const m=typeof ex==='string'?ex:(ex.memo||'');
                            const im=typeof ex==='string'?null:(ex.image||null);
                            setPinModal({open:true,dateKey,memo:m,image:im,imgEdit:defaultImgEdit});
                          }} title="편집"><IconPen size={10}/></button>
                          <button className="postit-btn del" onClick={()=>removePin(dateKey)} title="삭제"><IconX size={8}/></button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* Export */}
            <div style={{display:'flex',justifyContent:'center',margin:'16px 0 4px'}}>
              <button className={`export-btn${exportStatus==='copied'?' done':''}`} onClick={exportCalendar}
                disabled={exportStatus==='loading'||exportStatus==='download'}>
                {exportStatus==='loading'&&'…'}
                {exportStatus==='copied'&&'✓ 복사됨'}
                {(exportStatus==='idle'||exportStatus==='download')&&'export'}
              </button>
              {exportStatus==='download'&&exportBlobUrl&&(
                <a href={exportBlobUrl}
                  download={`calendar-${currentDate.getFullYear()}-${String(currentDate.getMonth()+1).padStart(2,'0')}.png`}
                  className="export-btn done" style={{textDecoration:'none',marginLeft:8}}
                  onClick={()=>{setTimeout(()=>{setExportStatus('idle');URL.revokeObjectURL(exportBlobUrl);setExportBlobUrl(null);},500);}}>
                  ↓ 다운로드</a>
              )}
            </div>
          </>
        )}
      </div>
    );

    /* ── TAB: CALENDAR ── */
    const CalendarTab = () => {
      const activeCals = calendars.length>4
        ? calendars.filter(c=>(overviewPicks??calendars.slice(0,4).map(c=>c.id)).includes(c.id))
        : calendars;
      return (
        <div style={{padding:'0 14px'}}>
          {/* Overview grid */}
          <div style={{paddingTop:14,paddingBottom:12,borderBottom:'1px solid var(--border)',marginBottom:14}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <button className="nav-button" onClick={()=>navigateMonth('prev')}>←</button>
              <span style={{fontSize:14,fontWeight:600,color:'var(--text-1)',cursor:'pointer'}}
                onClick={()=>setCurrentDate(new Date())}>
                {currentDate.toLocaleString('en-US',{month:'long',year:'numeric'})}
              </span>
              <button className="nav-button" onClick={()=>navigateMonth('next')}>→</button>
            </div>

            {calendars.length>4 && (
              <div style={{marginBottom:10}}>
                <p style={{fontSize:9,color:'var(--text-3)',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:5}}>표시할 캘린더 (최대 4개)</p>
                <div style={{display:'flex',flexWrap:'wrap',gap:4}}>
                  {calendars.map(cal=>{
                    const curPicks=overviewPicks??calendars.slice(0,4).map(c=>c.id);
                    const isPicked=curPicks.includes(cal.id);
                    return (
                      <button key={cal.id} onClick={()=>{
                        const cur=overviewPicks??calendars.slice(0,4).map(c=>c.id);
                        if(isPicked) setOverviewPicks(cur.filter(id=>id!==cal.id));
                        else if(cur.length<4) setOverviewPicks([...cur,cal.id]);
                      }} style={{
                        display:'flex',alignItems:'center',gap:4,
                        padding:'3px 8px',border:`1px solid ${isPicked?'var(--border-hi)':'var(--border)'}`,
                        borderRadius:0,cursor:'pointer',
                        background:isPicked?'var(--press)':'transparent',
                        fontSize:10,color:isPicked?'var(--text-1)':'var(--text-3)',maxWidth:120,overflow:'hidden',
                      }}>
                        <div style={{width:5,height:5,borderRadius:'50%',background:cal.color,flexShrink:0}} />
                        <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{cal.title}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            <div className="calendar-grid" style={{marginBottom:4}}>
              {DOW_LABELS.map(d=><div key={d} className="calendar-day day-header">{d}</div>)}
            </div>
            <div className="calendar-grid">
              {Array(firstDay).fill(null).map((_,i)=><div key={`e-${i}`} className="calendar-day day-empty"/>)}
              {Array(daysInMonth).fill(null).map((_,i)=>{
                const day=i+1;
                const dateKey=`${currentDate.getFullYear()}-${currentDate.getMonth()+1}-${day}`;
                const doneCals=activeCals.filter(c=>c.completedDates.includes(dateKey));
                const colors=doneCals.map(c=>c.color);
                const isToday=day===todayDay;
                return (
                  <div key={day} className="day-wrapper">
                    <button className="calendar-day" disabled style={{
                      fontWeight:isToday?700:'normal',
                      border:isToday?'1px solid var(--border-hi)':'',
                      position:'relative',
                    }}>
                      {day}
                      {colors.length>0 && (
                        <div style={{position:'absolute',bottom:2,right:2,borderRadius:'50%',overflow:'hidden',lineHeight:0}}>
                          <CloverDot colors={colors} />
                        </div>
                      )}
                    </button>
                  </div>
                );
              })}
            </div>
            {activeCals.length>0 && (
              <div style={{display:'flex',flexWrap:'wrap',gap:'4px 12px',marginTop:10}}>
                {activeCals.map(cal=>(
                  <div key={cal.id} style={{display:'flex',alignItems:'center',gap:4}}>
                    <div style={{width:6,height:6,borderRadius:'50%',background:cal.color}} />
                    <span style={{fontSize:9,color:'var(--text-2)'}}>{cal.title}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Calendar list */}
          <p style={{fontSize:9,color:'var(--text-3)',letterSpacing:'0.12em',textTransform:'uppercase',marginBottom:8}}>Calendars</p>

          {selectedCalendar && selectedCalendar !== 'all' && (() => {
            const selCal = calendars.find(c => c.id === selectedCalendar);
            if (!selCal) return null;
            const thisDone = (selCal.completedDates || []).filter(d => {
              const p = d.split('-');
              return parseInt(p[0]) === currentDate.getFullYear() && parseInt(p[1]) === currentDate.getMonth()+1;
            }).length;
            const rate = daysInMonth > 0 ? Math.round((thisDone / daysInMonth) * 100) : 0;
            return (
              <div style={{marginBottom:12,padding:'10px 12px',background:'var(--surface)',border:'1px solid var(--border)'}}>
                <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:5}}>
                  <div style={{width:9,height:9,borderRadius:'50%',background:selCal.color,flexShrink:0}} />
                  <span style={{fontSize:12,fontWeight:600,color:'var(--text-1)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{selCal.title}</span>
                  <span style={{fontSize:10,color:'var(--text-3)',fontFamily:"'DM Mono',monospace",flexShrink:0}}>{rate}%</span>
                </div>
                <div style={{height:2,background:'var(--border)',position:'relative',overflow:'hidden'}}>
                  <div style={{position:'absolute',left:0,top:0,height:'100%',width:`${rate}%`,background:selCal.color}} />
                </div>
                <div style={{fontSize:9,color:'var(--text-3)',marginTop:5,letterSpacing:'0.06em',textTransform:'uppercase'}}>{thisDone} / {daysInMonth} completed</div>
              </div>
            );
          })()}

          <div className="calendar-list">
            {calendars.length>0 && (
              <div className={`calendar-item${selectedCalendar==='all'?' selected':''}`} onClick={()=>setSelectedCalendar('all')}>
                <div className="cal-item-left">
                  <div style={{width:10,height:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <svg width="10" height="10" viewBox="0 0 10 10">
                      <circle cx="3.2" cy="3.2" r="2.6" fill={calendars[0]?.color||'#aaa'} opacity="0.92"/>
                      <circle cx="6.8" cy="3.2" r="2.6" fill={calendars[1]?.color||(calendars[0]?.color||'#aaa')} opacity="0.92"/>
                      <circle cx="6.8" cy="6.8" r="2.6" fill={calendars[2]?.color||(calendars[0]?.color||'#aaa')} opacity="0.92"/>
                      <circle cx="3.2" cy="6.8" r="2.6" fill={calendars[3]?.color||(calendars[0]?.color||'#aaa')} opacity="0.92"/>
                    </svg>
                  </div>
                  <span className="cal-title-text">모아보기</span>
                </div>
              </div>
            )}
            {calendars.map(cal => {
              if (editingCalId===cal.id) return (
                <div key={cal.id} className="cal-edit-form">
                  <input type="text" className="input-text-sm" value={editTitle}
                    onChange={e=>setEditTitle(e.target.value)}
                    onKeyDown={e=>e.key==='Enter'&&saveEditCalendar(cal.id)} autoFocus style={{marginBottom:0}} />
                  <div className="cal-edit-row">
                    <input type="color" className="color-picker-sm" value={editColor} onChange={e=>setEditColor(e.target.value)} />
                    <button className="sm-button" style={{flex:1}} onClick={()=>saveEditCalendar(cal.id)}>저장</button>
                    <button className="sm-button" onClick={cancelEditCalendar}>취소</button>
                  </div>
                </div>
              );
              return (
                <div key={cal.id} data-cal-id={cal.id}
                  className={`calendar-item${selectedCalendar===cal.id?' selected':''} ${dragOverId===cal.id?'drag-over':''}`}
                  onClick={()=>{ setSelectedCalendar(cal.id); setActiveTab('today'); }}>
                  <span className="cal-drag-handle" title="드래그하여 순서 변경" style={{touchAction:'none'}}
                    onPointerDown={e=>handleDragHandlePointerDown(e,cal.id)}
                    onPointerMove={handleDragHandlePointerMove}
                    onPointerUp={handleDragHandlePointerUp}
                    onPointerCancel={handleDragHandlePointerUp}>⠿</span>
                  <div className="cal-item-left">
                    <div className="cal-color-dot" style={{background:cal.color}} />
                    <span className="cal-title-text">{cal.title}</span>
                  </div>
                  <div className="cal-item-actions">
                    <button className="icon-btn" onClick={e=>startEditCalendar(cal,e)} title="편집"><IconPen size={11}/></button>
                    <button className="icon-btn del" onClick={e=>deleteCalendar(cal.id,e)} title="삭제"><IconX size={9}/></button>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="new-calendar-form" style={{marginTop:14}}>
            <input type="text" className="input-text" placeholder="Title here" value={newTitle}
              onChange={e=>setNewTitle(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCalendar()} />
            <div className="color-picker-container">
              <input type="color" className="color-picker" value={newColor} onChange={e=>setNewColor(e.target.value)} />
              <button className="add-button" onClick={addCalendar}>Add</button>
            </div>
          </div>
        </div>
      );
    };

    /* ── TAB: SETTINGS (phone settings tab) ── */
    const SettingsTab = () => (
      <div style={{padding:'14px 14px'}}>
        <p style={{fontSize:13,fontWeight:600,color:'var(--text-1)',marginBottom:16}}>Settings</p>
        <SettingsContent />
      </div>
    );

    /* ── RENDER ── */
    return (
      <div className="page-wrapper">
        {/* ── PHONE SHELL ── */}
        <div className="phone-shell">
          <div className="phone-screen">
            <div className="phone-notch" />

            {/* Phone content area */}
            <div className="phone-content">
              {activeTab==='today' && <TodayTab />}
              {activeTab==='calendar' && <CalendarTab />}
              {activeTab==='settings' && <SettingsTab />}
            </div>

            {/* Settings bottom sheet */}
            {isSettingsSheetOpen && (
              <div className="bottom-sheet-overlay" onClick={()=>setIsSettingsSheetOpen(false)}>
                <div className="bottom-sheet" onClick={e=>e.stopPropagation()}>
                  <div className="sheet-handle" />
                  <p style={{fontSize:13,fontWeight:600,color:'var(--text-1)',marginBottom:14}}>Appearance</p>
                  <SettingsContent />
                </div>
              </div>
            )}

            {/* PIN MODAL */}
            {pinModal.open && (
              <div className="bottom-sheet-overlay" onClick={()=>setPinModal({open:false,dateKey:'',memo:'',image:null})}>
                <div className="bottom-sheet" onClick={e=>e.stopPropagation()}>
                  <div className="sheet-handle" />
                  <p style={{fontSize:10,color:'var(--text-3)',letterSpacing:'0.1em',marginBottom:3}}>{formatDateKey(pinModal.dateKey)}</p>
                  <p style={{fontSize:12,color:'var(--text-2)',marginBottom:10}}>{currentCalendar.title||''}</p>
                  <p style={{fontSize:10,color:'var(--text-3)',marginBottom:10}}>메모를 비우고 저장하면 핀이 제거돼요.</p>
                  <textarea className="modal-textarea" value={pinModal.memo}
                    onChange={e=>setPinModal(prev=>({...prev,memo:e.target.value}))}
                    placeholder="이 날짜에 대해 남겨두고 싶은 말" autoFocus />

                  <div style={{marginBottom:12}}>
                    {pinModal.image ? (() => {
                      const ie=pinModal.imgEdit||defaultImgEdit;
                      const btnSt=(active)=>({
                        padding:'4px 8px',border:`1px solid ${active?'var(--border-hi)':'var(--border)'}`,
                        borderRadius:0,cursor:'pointer',
                        background:active?'var(--press)':'transparent',
                        color:active?'var(--text-1)':'var(--text-2)',fontSize:12,
                      });
                      return (
                        <div>
                          <div style={{
                            position:'relative',width:'100%',height:150,overflow:'hidden',borderRadius:0,
                            marginBottom:7,display:'flex',alignItems:'center',justifyContent:'center',
                            cursor:'grab',userSelect:'none',border:'1px solid var(--border)',
                          }}
                            onPointerDown={e=>{
                              e.currentTarget.setPointerCapture(e.pointerId);
                              imgDragRef.current={active:true,startX:e.clientX,startY:e.clientY,
                                baseOffX:(pinModal.imgEdit||defaultImgEdit).offsetX,baseOffY:(pinModal.imgEdit||defaultImgEdit).offsetY};
                              e.currentTarget.style.cursor='grabbing';
                            }}
                            onPointerMove={e=>{
                              if(!imgDragRef.current.active) return;
                              const dx=e.clientX-imgDragRef.current.startX,dy=e.clientY-imgDragRef.current.startY;
                              setPinModal(prev=>({...prev,imgEdit:{...(prev.imgEdit||defaultImgEdit),offsetX:imgDragRef.current.baseOffX+dx,offsetY:imgDragRef.current.baseOffY+dy}}));
                            }}
                            onPointerUp={e=>{imgDragRef.current.active=false;e.currentTarget.releasePointerCapture(e.pointerId);e.currentTarget.style.cursor='grab';}}>
                            <img src={pinModal.image} alt="" style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'cover',filter:'blur(12px)',transform:'scale(1.15)',pointerEvents:'none',opacity:0.8}} />
                            <img src={pinModal.image} alt="" style={{maxWidth:'100%',maxHeight:'100%',display:'block',position:'relative',zIndex:1,
                              transform:`translate(${ie.offsetX}px,${ie.offsetY}px) rotate(${ie.rotate}deg) scaleX(${ie.flipH?-1:1}) scaleY(${ie.flipV?-1:1}) scale(${ie.scale})`,
                              transformOrigin:'center',pointerEvents:'none'}} />
                            <button onPointerDown={e=>e.stopPropagation()}
                              onClick={e=>{e.stopPropagation();setPinModal(prev=>({...prev,image:null,imgEdit:defaultImgEdit}));}}
                              style={{position:'absolute',top:5,right:5,zIndex:2,background:'rgba(0,0,0,0.4)',border:'none',borderRadius:'50%',
                                width:20,height:20,cursor:'pointer',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',padding:0}}>
                              <IconX size={8}/>
                            </button>
                            {(ie.offsetX!==0||ie.offsetY!==0)&&(
                              <button onPointerDown={e=>e.stopPropagation()}
                                onClick={e=>{e.stopPropagation();setPinModal(prev=>({...prev,imgEdit:{...(prev.imgEdit||defaultImgEdit),offsetX:0,offsetY:0}}));}}
                                style={{position:'absolute',bottom:5,right:5,zIndex:2,background:'rgba(0,0,0,0.3)',border:'none',borderRadius:0,
                                  padding:'2px 6px',cursor:'pointer',color:'#fff',fontSize:9}}>중앙 초기화</button>
                            )}
                          </div>
                          <div style={{display:'flex',flexWrap:'wrap',gap:5,alignItems:'center'}}>
                            <button style={btnSt(false)} title="90° 왼쪽" onClick={()=>setPinModal(prev=>({...prev,imgEdit:{...(prev.imgEdit||defaultImgEdit),rotate:((prev.imgEdit||defaultImgEdit).rotate-90+360)%360}}))}>↺</button>
                            <button style={btnSt(false)} title="90° 오른쪽" onClick={()=>setPinModal(prev=>({...prev,imgEdit:{...(prev.imgEdit||defaultImgEdit),rotate:((prev.imgEdit||defaultImgEdit).rotate+90)%360}}))}>↻</button>
                            <button style={btnSt(ie.flipH)} title="좌우 반전" onClick={()=>setPinModal(prev=>({...prev,imgEdit:{...(prev.imgEdit||defaultImgEdit),flipH:!(prev.imgEdit||defaultImgEdit).flipH}}))}>↔</button>
                            <button style={btnSt(ie.flipV)} title="상하 반전" onClick={()=>setPinModal(prev=>({...prev,imgEdit:{...(prev.imgEdit||defaultImgEdit),flipV:!(prev.imgEdit||defaultImgEdit).flipV}}))}>↕</button>
                            <input type="range" min="0.4" max="2.0" step="0.05" value={ie.scale}
                              onChange={e=>setPinModal(prev=>({...prev,imgEdit:{...(prev.imgEdit||defaultImgEdit),scale:parseFloat(e.target.value)}}))}
                              style={{flex:1,minWidth:60,cursor:'pointer'}} title={`${Math.round(ie.scale*100)}%`} />
                            <span style={{fontSize:10,color:'var(--text-3)',minWidth:28}}>{Math.round(ie.scale*100)}%</span>
                          </div>
                        </div>
                      );
                    })() : (
                      <div style={{display:'flex',alignItems:'center',gap:8}}>
                        <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
                          <input type="file" accept="image/*" style={{display:'none'}} onChange={handleImageSelect} />
                          <span style={{padding:'5px 12px',border:'1px solid var(--border)',borderRadius:0,fontSize:11,color:'var(--text-2)',cursor:'pointer'}}>+ 사진 첨부</span>
                        </label>
                        <span style={{fontSize:10,color:'var(--text-3)'}}>또는 Ctrl+V 붙여넣기</span>
                      </div>
                    )}
                  </div>

                  <div className="modal-actions">
                    <button className="sm-button" onClick={()=>setPinModal({open:false,dateKey:'',memo:'',image:null})}>취소</button>
                    <button className="sm-button" style={{background:'var(--accent)',color:'#fff',borderColor:'var(--accent)'}} onClick={savePinMemo}>저장</button>
                  </div>
                </div>
              </div>
            )}

            {/* ALL MEMOS MODAL */}
            {showMemos && (() => {
              const allMemos=[];
              calendars.forEach(cal=>{
                Object.entries(cal.pinnedDates||{}).forEach(([dateKey,pinData])=>{
                  const memo=typeof pinData==='string'?pinData:(pinData?.memo||'');
                  const img=typeof pinData==='string'?null:(pinData?.image||null);
                  if(memo||img) allMemos.push({dateKey,memo,img,calTitle:cal.title,calColor:cal.color});
                });
              });
              allMemos.sort((a,b)=>{
                const [ay,am,ad]=a.dateKey.split('-').map(Number);
                const [by,bm,bd]=b.dateKey.split('-').map(Number);
                return new Date(by,bm-1,bd)-new Date(ay,am-1,ad);
              });
              const grouped={};
              allMemos.forEach(m=>{
                const [y,mo]=m.dateKey.split('-');
                const key=`${y}.${String(mo).padStart(2,'0')}`;
                if(!grouped[key]) grouped[key]=[];
                grouped[key].push(m);
              });
              return (
                <div className="bottom-sheet-overlay" onClick={()=>setShowMemos(false)}>
                  <div className="bottom-sheet" onClick={e=>e.stopPropagation()}>
                    <div className="sheet-handle" />
                    <p className="memos-modal-title">전체 메모</p>
                    {allMemos.length===0 ? (
                      <p className="memos-empty">아직 메모가 없어요.</p>
                    ) : (
                      Object.entries(grouped).map(([monthLabel,entries])=>(
                        <div key={monthLabel}>
                          <p className="memo-group-label">{monthLabel}</p>
                          {entries.map((m,i)=>(
                            <div key={i} className="memo-entry">
                              <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:5}}>
                                <div style={{width:5,height:5,borderRadius:'50%',background:m.calColor,flexShrink:0}} />
                                <span className="memo-entry-date">{m.calTitle} · {m.dateKey.replace(/-/g,'.')}</span>
                              </div>
                              {m.memo?<p className="memo-entry-text">{m.memo}</p>:null}
                              {m.img?<img src={m.img} alt="" className="memo-entry-img"/>:null}
                            </div>
                          ))}
                        </div>
                      ))
                    )}
                  </div>
                </div>
              );
            })()}

            {/* Tab bar */}
            <div className="phone-tab-bar">
              <button className={`tab-btn${activeTab==='today'?' active':''}`} onClick={()=>setActiveTab('today')}>
                <svg viewBox="0 0 24 24" fill="none" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="3"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                  <circle cx="12" cy="16" r="1.5" fill="currentColor" stroke="none"/>
                </svg>
                today
                {activeTab==='today' && <div className="tab-active-bar" />}
              </button>
              <button className={`tab-btn${activeTab==='calendar'?' active':''}`} onClick={()=>setActiveTab('calendar')}>
                <svg viewBox="0 0 24 24" fill="none" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="4" width="18" height="18" rx="3"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                  <line x1="7" y1="15" x2="17" y2="15"/>
                  <line x1="7" y1="19" x2="13" y2="19"/>
                </svg>
                calendar
                {activeTab==='calendar' && <div className="tab-active-bar" />}
              </button>
              <button className={`tab-btn${activeTab==='settings'?' active':''}`} onClick={()=>{
                if(window.innerWidth < 1000) setIsSettingsSheetOpen(true);
                else setActiveTab('settings');
              }}>
                <svg viewBox="0 0 24 24" fill="none" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                settings
                {activeTab==='settings' && <div className="tab-active-bar" />}
              </button>
            </div>
          </div>
        </div>

        {/* ── SIDE PANEL (wide screens only) ── */}
        <div className="side-panel">
          <p style={{fontSize:11,fontWeight:600,color:'var(--text-2)',letterSpacing:'0.1em',textTransform:'uppercase',marginBottom:16}}>Appearance</p>
          <SettingsContent />
        </div>

      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<PasswordGuard><App /></PasswordGuard>);
  </script>
</body>
</html>
